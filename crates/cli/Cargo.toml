[package]
name = "fetchloom-cli"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lib]
name = "fetchloom_cli"
path = "src/lib.rs"

[[bin]]
name = "fetchloom"
path = "src/main.rs"

[dependencies]
clap = { workspace = true }
clap_complete = { workspace = true }
fetchloom-cache = { workspace = true }
fetchloom-engine = { workspace = true }
fetchloom-platform = { workspace = true }
fetchloom-sources = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
toml = { workspace = true }

[target.'cfg(target_env = "musl")'.dependencies]
mimalloc = { workspace = true, optional = true }

[features]
mimalloc = ["dep:mimalloc"]

[dev-dependencies]
fetchloom-faults = { workspace = true }
tempfile = { workspace = true }

[lints]
workspace = true
