[package]
name = "fetchloom-cli"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lib]
name = "fetchloom_cli"
path = "src/lib.rs"

[[bin]]
name = "fetchloom"
path = "src/main.rs"

[dependencies]
clap = { workspace = true }
ctrlc = { workspace = true }
clap_complete = { workspace = true }
fetchloom-archive = { workspace = true }
fetchloom-cache = { workspace = true }
fetchloom-engine = { workspace = true }
fetchloom-platform = { workspace = true }
fetchloom-sources = { workspace = true }
fetchloom-view = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
toml = { workspace = true }

[target.'cfg(target_env = "musl")'.dependencies]
mimalloc = { workspace = true, optional = true }

[features]
mimalloc = ["dep:mimalloc"]

[dev-dependencies]
fetchloom-faults = { workspace = true }
flate2 = { workspace = true }
tempfile = { workspace = true }

[target.'cfg(unix)'.dev-dependencies]
rustix = { workspace = true }

[target.'cfg(windows)'.dev-dependencies]
windows-sys = { workspace = true, features = ["Win32_System_Console"] }

[lints]
workspace = true
