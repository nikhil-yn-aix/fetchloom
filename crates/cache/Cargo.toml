[package]
name = "fetchloom-cache"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
blake3 = { workspace = true }
fetchloom-engine = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }

[dev-dependencies]
fetchloom-faults = { workspace = true }
fetchloom-platform = { workspace = true }
tempfile = { workspace = true }

[lints]
workspace = true

[target.'cfg(all(target_arch = "aarch64", target_os = "windows"))'.dependencies]
blake3 = { workspace = true, features = ["no_neon"] }

[target.'cfg(windows)'.dev-dependencies]
windows-sys = { workspace = true, features = ["Win32_System_Threading"] }
