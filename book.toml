[book]
title = "fetchloom"
description = "uv for research data: a manifest, a lock and one shared cache"
language = "en"
src = "docs"

[build]
build-dir = "site"
create-missing = false
# the index preprocessor renames README.md to index.html but leaves links to README.md alone
use-default-preprocessors = false

[output.html]
default-theme = "light"
preferred-dark-theme = "navy"
git-repository-url = "https://github.com/nikhil-yn-aix/fetchloom"
edit-url-template = "https://github.com/nikhil-yn-aix/fetchloom/edit/main/docs/{path}"
site-url = "/fetchloom/"

[output.html.search]
enable = true
