name: hosts

on:
  push:
    branches: [main, ci]
  schedule:
    - cron: "17 5 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: hosts-${{ github.ref }}
  cancel-in-progress: false

jobs:
  lane:
    name: ${{ matrix.lane }} ${{ matrix.runner }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - lane: network
            runner: ubuntu-24.04
          - lane: network
            runner: ubuntu-24.04-arm
          - lane: network
            runner: windows-2025
          - lane: network
            runner: windows-11-arm
          - lane: offline
            runner: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: ${{ matrix.lane }}-${{ matrix.runner }}
      - run: cargo xtask verify --lane ${{ matrix.lane }} --provision
      - run: cargo xtask verify --lane ${{ matrix.lane }}
