name: release

on:
  push:
    tags: ['v*.*.*']

permissions: {}

concurrency:
  group: release-${{ github.ref }}

env:
  CARGO_TERM_COLOR: always
  # links the C runtime into the windows binaries, for the C dependencies too, so they need no
  # visual c++ redistributable
  CARGO_TARGET_X86_64_PC_WINDOWS_MSVC_RUSTFLAGS: -C target-feature=+crt-static
  CARGO_TARGET_AARCH64_PC_WINDOWS_MSVC_RUSTFLAGS: -C target-feature=+crt-static
  # `fetchloom --version -v` names the commit a release was built from
  FETCHLOOM_COMMIT: ${{ github.sha }}

jobs:
  build:
    name: ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            exe: .exe
            python: python
            scripts: Scripts
            wheel-tags: ''
          - os: windows-11-arm
            target: aarch64-pc-windows-msvc
            exe: .exe
            python: python
            scripts: Scripts
            wheel-tags: ''
          - os: ubuntu-latest
            target: x86_64-unknown-linux-musl
            exe: ''
            python: python3
            scripts: bin
            # the binaries are static, so the wheel runs on glibc systems too
            wheel-tags: --compatibility manylinux2014 musllinux_1_2
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-musl
            exe: ''
            python: python3
            scripts: bin
            wheel-tags: --compatibility manylinux2014 musllinux_1_2
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: read the version
        run: |
          version=$(sed -n 's/^version = "\(.*\)"$/\1/p' Cargo.toml | head -n 1)
          if [ "$GITHUB_REF_TYPE" = tag ] && [ "$GITHUB_REF_NAME" != "v$version" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match version $version in Cargo.toml"
            exit 1
          fi
          echo "VERSION=$version" >> "$GITHUB_ENV"
      # installs the version rust-toolchain.toml pins
      - run: rustup toolchain install
      - run: rustup target add ${{ matrix.target }}
      # the cc crate builds zstd, bzip2, liblzma and ring with musl-gcc for the musl target
      - name: install the musl C compiler
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq musl-tools > /dev/null
      - run: cargo build --locked --release --target ${{ matrix.target }}
      - name: check that the binary runs
        run: |
          for name in fetchloom; do
            said=$("target/${{ matrix.target }}/release/$name${{ matrix.exe }}" --version)
            echo "$name --version: $said"
            if [ "$said" != "fetchloom $VERSION" ]; then
              echo "::error::$name --version printed $said"
              exit 1
            fi
          done
      - name: check that the linux binary is static
        if: runner.os == 'Linux'
        run: |
          for name in fetchloom; do
            said=$(ldd "target/${{ matrix.target }}/release/$name" 2>&1 || true)
            echo "ldd $name: $said"
            case "$said" in
              *"statically linked"* | *"not a dynamic executable"*) ;;
              *) echo "::error::$name links shared libraries"; exit 1 ;;
            esac
          done
      - name: check that the windows binary carries its C runtime
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $vs = & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" -latest -property installationPath
          $paths = @("$vs\VC\Tools\MSVC\*\bin\Hostx64\*\dumpbin.exe")
          if ($env:RUNNER_ARCH -eq 'ARM64') {
            $paths = @("$vs\VC\Tools\MSVC\*\bin\Hostarm64\*\dumpbin.exe") + $paths
          }
          $dumpbin = Get-ChildItem $paths -ErrorAction SilentlyContinue | Select-Object -First 1 -ExpandProperty FullName
          if (-not $dumpbin) {
            if ($env:RUNNER_ARCH -eq 'ARM64') {
              # the arm image may omit dumpbin; the other binary and wheel checks still run
              Write-Output '::notice::dumpbin is unavailable on this arm64 runner; skipping the C runtime check'
              exit 0
            }
            throw 'could not find dumpbin to check the C runtime'
          }
          foreach ($name in 'fetchloom') {
            $dlls = & $dumpbin /nologo /dependents "target\${{ matrix.target }}\release\$name.exe"
            if ($LASTEXITCODE) { throw "dumpbin could not inspect $name.exe" }
            $dlls
            if ($dlls -match 'vcruntime|msvcp|ucrtbase|api-ms-win-crt') { throw "$name.exe loads the C runtime from a DLL" }
          }
      - name: package the binary
        run: |
          name="fetchloom-$VERSION-${{ matrix.target }}"
          mkdir -p ".release/$name" dist
          cp "target/${{ matrix.target }}/release/fetchloom${{ matrix.exe }}" \
            LICENSE NOTICE README.md ".release/$name/"
          cd .release
          if [ "$RUNNER_OS" = Windows ]; then
            7z a -tzip -bso0 "../dist/$name.zip" "$name"
          else
            tar --owner=0 --group=0 --numeric-owner -czf "../dist/$name.tar.gz" "$name"
          fi
      - name: build the wheel
        run: |
          "${{ matrix.python }}" -m venv .release/maturin
          # the x86_64 and arm64 linux and windows wheels of maturin 1.16.0 on pypi
          cat > .release/maturin.txt <<'EOF'
          maturin==1.16.0 \
            --hash=sha256:837db2f4d93d4899c3ac393fb3cc9eebf35b6002336e5d574f4a4fb6c49fe283 \
            --hash=sha256:9d43a2adf51a2794e907a8f7dbad06eb114d5edb0909c73c1fa9040f15e584e9 \
            --hash=sha256:e285ec9eb10243d45d10417178cb2eb76e0cbb184d0aa4378b503489fa12ee78 \
            --hash=sha256:95f34ce53249fb7095ff4f2aff64d2562c511d6edf3e216c15dbffcd82b72b4f
          EOF
          .release/maturin/${{ matrix.scripts }}/python -m pip install --quiet --disable-pip-version-check \
            --require-hashes --only-binary :all: -r .release/maturin.txt
          # reuses the binary built and checked above
          .release/maturin/${{ matrix.scripts }}/maturin build --release --locked \
            --target ${{ matrix.target }} --out dist ${{ matrix.wheel-tags }}
      - name: check the wheel
        run: |
          "${{ matrix.python }}" -m venv .release/check
          check=.release/check/${{ matrix.scripts }}
          "$check/python" -m pip install --quiet --disable-pip-version-check --no-index dist/*.whl
          for name in fetchloom; do
            said=$("$check/$name" --version)
            echo "wheel $name --version: $said"
            if [ "$said" != "fetchloom $VERSION" ]; then
              echo "::error::the wheel's $name --version printed $said"
              exit 1
            fi
          done
          mkdir -p .release/empty
          "$check/python" - <<'EOF'
          import fetchloom
          try:
              fetchloom.path("iris", project=".release/empty")
          except fetchloom.Error as error:
              assert error.kind == "project.invalid", f"unexpected error kind: {error.kind}"
              print(f"fetchloom.path outside a project raised {error.kind}: {error.message}")
          else:
              raise SystemExit("fetchloom.path found a dataset outside a project")
          EOF
      - name: list the sizes
        run: |
          {
            echo '| file | bytes |'
            echo '|---|---|'
            for file in target/${{ matrix.target }}/release/fetchloom${{ matrix.exe }} dist/*; do
              echo "| $(basename "$file") | $(wc -c < "$file") |"
            done
          } | tee -a "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ matrix.target }}
          path: dist/*
          if-no-files-found: error

  attest:
    needs: build
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: dist
          merge-multiple: true
      - name: write SHA256SUMS
        run: |
          cp install.sh install.ps1 dist/
          cd dist
          sha256sum -- *.zip *.tar.gz *.whl install.sh install.ps1 > SHA256SUMS
          cat SHA256SUMS
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-checksums: dist/SHA256SUMS
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release
          path: dist/*
          if-no-files-found: error

  release:
    needs: attest
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release
          path: dist
      - name: create a draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/* --repo "$GITHUB_REPOSITORY" --draft --verify-tag \
            --title "fetchloom ${GITHUB_REF_NAME#v}" --generate-notes
