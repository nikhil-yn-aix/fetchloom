name: refs stress

# churns files on new refs volumes, made as the windows refs lane makes them, one way per run: hard
# links, block clones, renames that never replace, and the way fetchloom would place without links.
# a push that changes .github/refs-stress.json runs it as that file says.

on:
  push:
    branches: [exp/refs-stress]
    paths: [.github/refs-stress.json]

permissions:
  contents: read
  actions: read

env:
  PIN_NEXTEST: cargo-nextest@0.9.151

jobs:
  plan:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      jobs: ${{ steps.plan.outputs.jobs }}
      parallel: ${{ steps.plan.outputs.parallel }}
      minutes: ${{ steps.plan.outputs.minutes }}
      arms: ${{ steps.plan.outputs.arms }}
      seconds: ${{ steps.plan.outputs.seconds }}
      threads: ${{ steps.plan.outputs.threads }}
      build: ${{ steps.plan.outputs.build }}
      filter: ${{ steps.plan.outputs.filter }}
      old: ${{ steps.plan.outputs.old }}
      fix: ${{ steps.plan.outputs.fix }}
      fix_ref: ${{ steps.plan.outputs.fix_ref }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: plan
        run: |
          python3 - <<'PY'
          import json, os
          plan = json.load(open(".github/refs-stress.json"))
          with open(os.environ["GITHUB_OUTPUT"], "a") as out:
              for key in ("jobs", "parallel", "minutes", "arms", "seconds", "threads", "build", "filter", "old", "fix", "fix_ref"):
                  value = plan.get(key, "")
                  value = value if isinstance(value, str) else json.dumps(value)
                  print(f"{key}: {value}")
                  out.write(f"{key}={value}\n")
          PY

  stress:
    needs: plan
    name: stress ${{ matrix.job }}
    runs-on: windows-2025
    timeout-minutes: 130
    strategy:
      fail-fast: false
      max-parallel: ${{ fromJSON(needs.plan.outputs.parallel) }}
      matrix:
        job: ${{ fromJSON(needs.plan.outputs.jobs) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - if: needs.plan.outputs.build != '' || needs.plan.outputs.old != '' || needs.plan.outputs.fix != ''
        uses: taiki-e/install-action@cfdb7ed4ccc7c7dce37759eae89dc5674b469b39 # v2.90.3
        with:
          tool: ${{ env.PIN_NEXTEST }}
      - if: needs.plan.outputs.old != ''
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: windows-test-build
          path: target/ci-old
          run-id: ${{ needs.plan.outputs.old }}
          github-token: ${{ github.token }}
      - if: needs.plan.outputs.fix_ref != ''
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.plan.outputs.fix_ref }}
          path: fix-source
          persist-credentials: false
      - if: needs.plan.outputs.fix != ''
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: windows-test-build
          path: fix-source/target/ci
          run-id: ${{ needs.plan.outputs.fix }}
          github-token: ${{ github.token }}
      - if: needs.plan.outputs.build != ''
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: windows-test-build
          path: target/ci
          run-id: ${{ needs.plan.outputs.build }}
          github-token: ${{ github.token }}
      - name: churn files on new refs volumes
        shell: pwsh
        timeout-minutes: 115
        env:
          ARMS: ${{ needs.plan.outputs.arms }}
          SECONDS_EACH: ${{ needs.plan.outputs.seconds }}
          THREADS: ${{ needs.plan.outputs.threads }}
          MINUTES: ${{ needs.plan.outputs.minutes }}
          JOB: ${{ matrix.job }}
          FILTER: ${{ needs.plan.outputs.filter }}
          BUILD: ${{ needs.plan.outputs.build }}
        run: >-
          .github/scripts/refs-stress.ps1 -Arms $env:ARMS -Seconds $env:SECONDS_EACH -Threads $env:THREADS
          -Minutes $env:MINUTES -Job $env:JOB -Out (Join-Path $env:RUNNER_TEMP 'refs-stress-out')
          -Archive $(if ($env:BUILD) { (Resolve-Path target/ci/windows-tests.tar.zst).Path } else { '' })
          -Filter $(if ($env:FILTER) { $env:FILTER } else { 'test(/^concurrent::/)' })
          -OldArchive $(if (Test-Path target/ci-old/windows-tests.tar.zst) { (Resolve-Path target/ci-old/windows-tests.tar.zst).Path } else { '' })
          -FixArchive $(if (Test-Path fix-source/target/ci/windows-tests.tar.zst) { (Resolve-Path fix-source/target/ci/windows-tests.tar.zst).Path } else { '' })
          -FixSource $(if (Test-Path fix-source) { (Resolve-Path fix-source).Path } else { '' })
      - name: keep what the runs saw
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: refs-stress-${{ matrix.job }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/refs-stress-out/
          if-no-files-found: warn
          compression-level: 1
          retention-days: 5
