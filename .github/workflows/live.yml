name: live

on:
  schedule:
    - cron: '17 4 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: live
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  CARGO_BUILD_JOBS: 4
  RUST_TEST_THREADS: 4

jobs:
  live:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025, macos-15]
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: rustup toolchain install
      # the cache ci's test jobs keep warm on every push. this weekly job only reads it: a cache it
      # saved could take that key without ci's clippy build
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: test
          save-if: false
      - name: live Rust source checks
        run: |
          mkdir -p target/live
          cargo test --locked -- --ignored --nocapture 2>&1 | tee target/live/rust.log
      # the debug executable the tests above built: the services behave the same for it, and
      # every push checks the release executables with the artifact journeys
      - name: mac public source and search journey
        if: ${{ !cancelled() && runner.os == 'macOS' }}
        run: python3 python/mac_live.py --binary target/debug/fetchloom 2>&1 | tee target/live/mac.log
      - name: report credential-dependent skips
        if: always()
        run: |
          python3 - <<'PY'
          import os
          from pathlib import Path
          log = Path('target/live/rust.log')
          skips = [line for line in log.read_text(encoding='utf-8', errors='replace').splitlines()
                   if 'skipped:' in line] if log.exists() else []
          with Path(os.environ['GITHUB_STEP_SUMMARY']).open('a', encoding='utf-8') as stream:
              stream.write('## live-source coverage\n\n')
              stream.write('\n'.join(skips) + '\n' if skips else 'no credential-dependent skip was reported; inspect the job result for failures.\n')
          PY
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: live-${{ matrix.os }}-${{ github.run_attempt }}
          path: target/live/
          if-no-files-found: warn
          retention-days: 14
