name: artifacts

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_BUILD_JOBS: 4
  # links the C runtime into the windows binaries, for the C dependencies too, so they need no
  # visual c++ redistributable.
  # never set RUSTFLAGS or CARGO_ENCODED_RUSTFLAGS in this workflow: cargo then ignores every
  # CARGO_TARGET_<triple>_RUSTFLAGS, so the windows binaries would quietly lose +crt-static and
  # every binary its path remapping. add flags to the per-target variables instead
  CARGO_TARGET_X86_64_PC_WINDOWS_MSVC_RUSTFLAGS: -C target-feature=+crt-static
  CARGO_TARGET_AARCH64_PC_WINDOWS_MSVC_RUSTFLAGS: -C target-feature=+crt-static
  # the oldest macos the binaries and wheels run on, the first that runs on apple silicon
  MACOSX_DEPLOYMENT_TARGET: '11.0'
  # keeps macos tar from adding ._ files that carry extended attributes
  COPYFILE_DISABLE: '1'
  # `fetchloom --version -v` names the commit a release was built from
  FETCHLOOM_COMMIT: ${{ github.sha }}

jobs:
  build:
    name: ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    env: &paths
      PROOFS: .release/proofs/${{ matrix.target }}
      PACKAGED: .release/artifact-bin/${{ matrix.target }}/fetchloom${{ matrix.exe }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-2025
            target: x86_64-pc-windows-msvc
            exe: .exe
            python: python
            scripts: Scripts
            wheel-tags: ''
            python-version: '3.15.2'
          - os: windows-11-arm
            target: aarch64-pc-windows-msvc
            exe: .exe
            python: python
            scripts: Scripts
            wheel-tags: ''
            python-version: '3.15.2'
          - os: ubuntu-24.04
            target: x86_64-unknown-linux-musl
            exe: ''
            python: python
            scripts: bin
            # the binaries are static, so the wheel runs on glibc systems too
            wheel-tags: --compatibility manylinux2014 musllinux_1_2
            python-version: '3.15.2'
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-musl
            exe: ''
            python: python
            scripts: bin
            wheel-tags: --compatibility manylinux2014 musllinux_1_2
            python-version: '3.15.2'
          - os: macos-15
            target: aarch64-apple-darwin
            exe: ''
            python: python
            scripts: bin
            wheel-tags: ''
            python-version: '3.15.2'
    defaults: &bash
      run:
        shell: bash
    steps:
      - &checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - &python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python-version }}
      - &version
        name: read the version
        run: |
          version=$(sed -n 's/^version = "\(.*\)"$/\1/p' Cargo.toml | head -n 1)
          if [ "$GITHUB_REF_TYPE" = tag ] && [ "$GITHUB_REF_NAME" != "v$version" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match version $version in Cargo.toml"
            exit 1
          fi
          echo "VERSION=$version" >> "$GITHUB_ENV"
          # the archives give every file the tag commit's time
          echo "SOURCE_DATE_EPOCH=$(git log -1 --format=%ct)" >> "$GITHUB_ENV"
      # installs the version rust-toolchain.toml pins
      - &toolchain
        run: rustup toolchain install
      - &target
        run: rustup target add ${{ matrix.target }}
      # rustc writes the paths of the source files it compiles into the binary, in panic messages
      # among other places. naming the cargo home /cargo and the checkout /src keeps the runner's
      # paths out of the release. the flags join the target's own, so windows keeps +crt-static,
      # and the wheel build below sees the same flags
      - &remap
        name: remap the build paths
        run: |
          cargo_home=${CARGO_HOME:-$HOME/.cargo}
          workspace=$GITHUB_WORKSPACE
          if [ "$RUNNER_OS" = Windows ]; then
            cargo_home=$(cygpath -w "$cargo_home")
            workspace=$(cygpath -w "$workspace")
          fi
          # cargo splits these flags at whitespace
          case "$cargo_home$workspace" in
            *[[:space:]]*)
              echo "::error::cannot remap $cargo_home or $workspace, which hold whitespace"
              exit 1
              ;;
          esac
          variable=CARGO_TARGET_$(echo "${{ matrix.target }}" | tr 'a-z-' 'A-Z_')_RUSTFLAGS
          flags="$(printenv "$variable" || true) --remap-path-prefix=$cargo_home=/cargo --remap-path-prefix=$workspace=/src"
          flags=${flags# }
          echo "$variable=$flags"
          echo "$variable=$flags" >> "$GITHUB_ENV"
      - &cache
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        if: github.ref_type != 'tag'
        with:
          shared-key: artifacts-${{ matrix.target }}
          save-if: ${{ github.event_name != 'pull_request' }}
      # the cc crate builds zstd, liblzma, ring and mimalloc with musl-gcc for the musl target
      - name: install the musl C compiler
        if: runner.os == 'Linux'
        run: .github/scripts/apt-install.sh musl-tools
      - &compile
        run: cargo build --locked --release --target ${{ matrix.target }}
      - &runs
        name: check that the binary runs
        run: |
          name=fetchloom
          said=$("target/${{ matrix.target }}/release/$name${{ matrix.exe }}" --version)
          echo "$name --version: $said"
          if [ "$said" != "fetchloom $VERSION" ]; then
            echo "::error::$name --version printed $said"
            exit 1
          fi
      - name: check that the linux binary is static
        if: runner.os == 'Linux'
        run: |
          name=fetchloom
          said=$(ldd "target/${{ matrix.target }}/release/$name" 2>&1 || true)
          echo "ldd $name: $said"
          case "$said" in
            *"statically linked"* | *"not a dynamic executable"*) ;;
            *) echo "::error::$name links shared libraries"; exit 1 ;;
          esac
      - &libraries
        name: check that the macos binary links only system libraries
        if: runner.os == 'macOS'
        run: |
          name=fetchloom
          binary="target/${{ matrix.target }}/release/$name"
          libraries=$(otool -L "$binary" | tail -n +2)
          echo "otool -L $name:"
          echo "$libraries"
          if echo "$libraries" | grep -vqE '^[[:space:]]+(/usr/lib/|/System/Library/)'; then
            echo "::error::$name links libraries macos does not ship"
            exit 1
          fi
          minimum=$(otool -l "$binary" | awk '/LC_BUILD_VERSION/ { found = 1 } found && $1 == "minos" { print $2; exit }')
          echo "$name runs on macos $minimum and later"
          if [ "$minimum" != "$MACOSX_DEPLOYMENT_TARGET" ]; then
            echo "::error::$name needs macos $minimum, not $MACOSX_DEPLOYMENT_TARGET"
            exit 1
          fi
      # reads the dlls fetchloom.exe imports straight from its import tables, so the check needs
      # no visual studio tool and runs on the arm64 image too. a file it cannot read fails it, as
      # does a list without kernel32.dll, which rust's standard library always imports
      - name: check that the windows binary carries its C runtime
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $path = "target\${{ matrix.target }}\release\fetchloom.exe"
          $bytes = [IO.File]::ReadAllBytes($path)
          $pe = [BitConverter]::ToInt32($bytes, 0x3c)
          if ([BitConverter]::ToUInt32($bytes, $pe) -ne 0x4550) { throw 'fetchloom.exe is not a PE file' }
          $sectionCount = [BitConverter]::ToUInt16($bytes, $pe + 6)
          $optional = $pe + 24
          if ([BitConverter]::ToUInt16($bytes, $optional) -ne 0x20b) { throw 'fetchloom.exe is not a 64-bit PE file' }
          $sections = $optional + [BitConverter]::ToUInt16($bytes, $pe + 20)
          function Get-Offset([uint32]$Rva) {
            for ($i = 0; $i -lt $sectionCount; $i++) {
              $header = $sections + 40 * $i
              $start = [BitConverter]::ToUInt32($bytes, $header + 12)
              $size = [Math]::Max([BitConverter]::ToUInt32($bytes, $header + 8), [BitConverter]::ToUInt32($bytes, $header + 16))
              if ($Rva -ge $start -and $Rva -lt $start + $size) {
                return [int]($Rva - $start + [BitConverter]::ToUInt32($bytes, $header + 20))
              }
            }
            throw "fetchloom.exe has no section holding address $Rva"
          }
          # data directory 1 lists the imported dlls in 20-byte entries with the name at 12, and
          # directory 13 the delay-loaded ones in 32-byte entries with the name at 4. each list
          # ends with an entry whose name is 0
          $dlls = foreach ($directory in @(@(1, 20, 12), @(13, 32, 4))) {
            $index, $entrySize, $nameAt = $directory
            $rva = [BitConverter]::ToUInt32($bytes, $optional + 112 + 8 * $index)
            if (-not $rva) { continue }
            for ($entry = Get-Offset $rva; ; $entry += $entrySize) {
              $name = [BitConverter]::ToUInt32($bytes, $entry + $nameAt)
              if (-not $name) { break }
              $at = Get-Offset $name
              [Text.Encoding]::ASCII.GetString($bytes, $at, [Array]::IndexOf($bytes, [byte]0, $at) - $at)
            }
          }
          $dlls
          if (-not ($dlls -match '^kernel32\.dll$')) { throw 'could not read the dlls fetchloom.exe imports' }
          if ($dlls -match 'vcruntime|msvcp|ucrtbase|api-ms-win-crt') { throw 'fetchloom.exe loads the C runtime from a DLL' }
      - &about
        uses: taiki-e/install-action@cfdb7ed4ccc7c7dce37759eae89dc5674b469b39 # v2.90.3
        with:
          tool: cargo-about@0.9.3
      # the licenses of the crates the six release binaries are built from, which most of them ask
      # to travel with every copy. --frozen reads only the crates cargo fetched, so every job
      # writes the same bytes
      - &licenses
        name: write the third-party licenses
        run: |
          cargo fetch --locked
          cargo about generate --frozen --fail about.hbs -o THIRD-PARTY-LICENSES
      # the same files pack into the same bytes: entries in a fixed order, every time set to the
      # commit's, owners as numbers and, for gzip, a header that holds no name or time
      - &package
        name: package the binary
        run: |
          name="fetchloom-$VERSION-${{ matrix.target }}"
          mkdir -p ".release/$name" dist
          cp "target/${{ matrix.target }}/release/fetchloom${{ matrix.exe }}" \
            LICENSE NOTICE README.md THIRD-PARTY-LICENSES ".release/$name/"
          cd .release
          if [ "$RUNNER_OS" = macOS ]; then
            stamp=$(date -u -r "$SOURCE_DATE_EPOCH" +%Y%m%d%H%M.%S)
          else
            stamp=$(date -u -d "@$SOURCE_DATE_EPOCH" +%Y%m%d%H%M.%S)
          fi
          find "$name" -exec env TZ=UTC0 touch -t "$stamp" {} +
          find "$name" | LC_ALL=C sort > files.txt
          if [ "$RUNNER_OS" = Windows ]; then
            # -mtc=off leaves out the ntfs creation and access times
            7z a -tzip -bso0 -mtc=off "../dist/$name.zip" @files.txt
          elif [ "$RUNNER_OS" = macOS ]; then
            # bsdtar names the owner with --uid and --gid rather than gnu tar's --owner
            tar --uid 0 --gid 0 --numeric-owner --no-xattrs --format ustar -n -T files.txt -cf - |
              gzip -n > "../dist/$name.tar.gz"
          else
            tar --owner=0 --group=0 --numeric-owner --no-recursion -T files.txt -cf - |
              gzip -n > "../dist/$name.tar.gz"
          fi
      - name: package the debian archive
        if: runner.os == 'Linux'
        run: |
          case "${{ matrix.target }}" in
            x86_64-*) arch=amd64 ;;
            aarch64-*) arch=arm64 ;;
          esac
          root=.release/deb
          install -Dm755 "target/${{ matrix.target }}/release/fetchloom" "$root/usr/bin/fetchloom"
          ln -s fetchloom "$root/usr/bin/fl"
          install -Dm644 LICENSE "$root/usr/share/doc/fetchloom/copyright"
          install -Dm644 NOTICE "$root/usr/share/doc/fetchloom/NOTICE"
          install -Dm644 THIRD-PARTY-LICENSES "$root/usr/share/doc/fetchloom/THIRD-PARTY-LICENSES"
          mkdir -p "$root/DEBIAN"
          # dpkg sorts 0.1.0~rc.1 before 0.1.0 and 0.1.0-rc.1 after it. the file keeps Cargo's
          # spelling, since a release upload renames a ~ in a file name to a dot
          debian=$(printf '%s' "$VERSION" | sed 's/-/~/')
          cat > "$root/DEBIAN/control" <<EOF
          Package: fetchloom
          Version: $debian
          Architecture: $arch
          Maintainer: Nikhil Y N <nikhil-yn-aix@users.noreply.github.com>
          Installed-Size: $(du -sk "$root/usr" | cut -f1)
          Section: utils
          Priority: optional
          Homepage: https://github.com/nikhil-yn-aix/fetchloom
          Description: put the exact data a project needs onto any machine
           fetchloom pins research datasets by SHA-256 in data.lock and places
           them in data/ from one shared cache.
          EOF
          deb="dist/fetchloom_${VERSION}_$arch.deb"
          dpkg-deb --build --root-owner-group "$root" "$deb"
          contents=$(dpkg-deb --contents "$deb")
          echo "$contents"
          case "$contents" in
            *' ./usr/bin/fl -> fetchloom'*) ;;
            *) echo "::error::the debian package lacks /usr/bin/fl as a link to fetchloom"; exit 1 ;;
          esac
          case "$contents" in
            *' ./usr/share/doc/fetchloom/THIRD-PARTY-LICENSES'*) ;;
            *) echo "::error::the debian package lacks the third-party licenses"; exit 1 ;;
          esac
          sudo dpkg -i "$deb"
          trap 'sudo dpkg -r fetchloom' EXIT
          test "$(dpkg-query --show --showformat='${Version}' fetchloom)" = "$debian"
          python python/ci_journey.py --binary /usr/bin/fetchloom --version "$VERSION" \
            --commit "$FETCHLOOM_COMMIT" --report "$PROOFS/deb.json"
          short=$(/usr/bin/fl --version)
          test "$short" = "fetchloom $VERSION"
          sudo dpkg -r fetchloom
          trap - EXIT
          if [ -e /usr/bin/fl ] || [ -L /usr/bin/fl ]; then
            echo "::error::removing the debian package left /usr/bin/fl behind"
            exit 1
          fi
      - &wheel
        name: build the wheel
        run: |
          "${{ matrix.python }}" -m venv .release/maturin
          # the x86_64 and arm64 linux, windows and macos wheels of maturin 1.16.0 on pypi
          cat > .release/maturin.txt <<'EOF'
          maturin==1.16.0 \
            --hash=sha256:837db2f4d93d4899c3ac393fb3cc9eebf35b6002336e5d574f4a4fb6c49fe283 \
            --hash=sha256:9d43a2adf51a2794e907a8f7dbad06eb114d5edb0909c73c1fa9040f15e584e9 \
            --hash=sha256:e285ec9eb10243d45d10417178cb2eb76e0cbb184d0aa4378b503489fa12ee78 \
            --hash=sha256:95f34ce53249fb7095ff4f2aff64d2562c511d6edf3e216c15dbffcd82b72b4f \
            --hash=sha256:131fcc17ddb3ccc48aa183d2172ebf994c322b858e1b9694fb8744d783df66f6 \
            --hash=sha256:2216d731c9324869d3bff72c0c73009bb6e640b3fa7d340174ae70dc874d1d9f
          EOF
          .release/maturin/${{ matrix.scripts }}/python -m pip install --quiet --disable-pip-version-check \
            --require-hashes --only-binary :all: -r .release/maturin.txt
          # reuses the binary built and checked above
          .release/maturin/${{ matrix.scripts }}/maturin build --release --locked \
            --target ${{ matrix.target }} --out dist ${{ matrix.wheel-tags }}
          .release/maturin/${{ matrix.scripts }}/python python/wheel_scripts.py dist/*.whl
      - &archive
        name: packaged binary journey
        run: |
          python python/check_archive.py --target ${{ matrix.target }} --version "$VERSION" \
            --commit "$FETCHLOOM_COMMIT" --built target/${{ matrix.target }}/release/fetchloom${{ matrix.exe }} \
            --proofs "$PROOFS"
      - &installed
        name: installed wheel on python ${{ matrix.python-version }}
        run: |
          python python/check_wheel.py dist/*.whl --binary "$PACKAGED" --version "$VERSION" \
            --commit "$FETCHLOOM_COMMIT" --stage wheel-current --proofs "$PROOFS"
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        if: matrix.target == 'x86_64-unknown-linux-musl' || matrix.target == 'x86_64-pc-windows-msvc'
        with:
          python-version: ${{ runner.os == 'Windows' && '3.10.11' || '3.10.22' }}
      - name: installed wheel on python 3.10
        if: matrix.target == 'x86_64-unknown-linux-musl' || matrix.target == 'x86_64-pc-windows-msvc'
        run: |
          python python/check_wheel.py dist/*.whl --binary "$PACKAGED" --version "$VERSION" \
            --commit "$FETCHLOOM_COMMIT" --stage wheel-minimum --proofs "$PROOFS"
      - &installer
        name: shell installer
        if: runner.os != 'Windows'
        run: |
          python python/check_installer.py --target ${{ matrix.target }} --version "$VERSION" \
            --commit "$FETCHLOOM_COMMIT" --binary "$PACKAGED" --shell sh --proofs "$PROOFS"
      - name: windows powershell installer
        if: matrix.target == 'x86_64-pc-windows-msvc'
        run: |
          python python/check_installer.py --target ${{ matrix.target }} --version "$VERSION" \
            --commit "$FETCHLOOM_COMMIT" --binary "$PACKAGED" --shell powershell --proofs "$PROOFS"
      - name: powershell 7 installer
        if: matrix.target == 'x86_64-pc-windows-msvc'
        run: |
          python python/check_installer.py --target ${{ matrix.target }} --version "$VERSION" \
            --commit "$FETCHLOOM_COMMIT" --binary "$PACKAGED" --shell pwsh --proofs "$PROOFS"
      - name: install the linux rar reader
        if: matrix.target == 'x86_64-unknown-linux-musl'
        run: |
          .github/scripts/apt-install.sh unrar
          unrar | sed -n '1,5p'
      - name: install the macos rar reader
        if: matrix.target == 'aarch64-apple-darwin'
        run: |
          brew install unar
          unar -v
      - name: check the windows rar reader
        if: matrix.target == 'x86_64-pc-windows-msvc'
        shell: pwsh
        run: |
          & 'C:\Program Files\7-Zip\7z.exe' i
          if ($LASTEXITCODE) { throw '7-Zip is missing' }
      - name: execute the printed rar command
        if: matrix.target == 'x86_64-unknown-linux-musl' || matrix.target == 'aarch64-apple-darwin' || matrix.target == 'x86_64-pc-windows-msvc'
        run: |
          python python/check_rar.py --binary "$PACKAGED" --version "$VERSION" \
            --commit "$FETCHLOOM_COMMIT" --proofs "$PROOFS"
      - &record
        name: record verified assets
        run: |
          python python/check_artifacts.py record dist "$PROOFS" --target ${{ matrix.target }} \
            --version "$VERSION" --commit "$FETCHLOOM_COMMIT"
      - &sizes
        name: list the sizes
        run: |
          {
            echo '| file | bytes |'
            echo '|---|---|'
            for file in target/${{ matrix.target }}/release/fetchloom${{ matrix.exe }} dist/*; do
              echo "| $(basename "$file") | $(wc -c < "$file") |"
            done
          } | tee -a "$GITHUB_STEP_SUMMARY"
      # the inventory and the release's attestation read these in the same run
      - &packages
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: packages-${{ matrix.target }}
          path: dist/*
          if-no-files-found: error
          retention-days: 7

      - &receipts
        name: retain check receipts
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: proof-${{ matrix.target }}
          path: .release/proofs/${{ matrix.target }}/
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 7

  # this release build takes nearly twice as long on the intel runner, so the arm runner
  # builds it and the intel runner only runs its checks
  intel-build:
    name: ${{ matrix.target }} build
    runs-on: macos-15
    timeout-minutes: 60
    env: *paths
    strategy:
      matrix:
        include:
          - &intel
            target: x86_64-apple-darwin
            exe: ''
            python: python
            scripts: bin
            wheel-tags: ''
            # the image's own python: installing 3.15.2 on the intel runner takes about 90 s,
            # and the other five targets test their wheels on it
            python-version: '3.14'
    defaults: *bash
    steps:
      - *checkout
      - *python
      - *version
      - *toolchain
      - *target
      - *remap
      - *cache
      - *compile
      - *libraries
      - *about
      - *licenses
      - *package
      - *wheel
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: candidate-${{ matrix.target }}
          path: |
            dist/*
            target/${{ matrix.target }}/release/fetchloom
            THIRD-PARTY-LICENSES
          if-no-files-found: error
          retention-days: 1

  intel:
    name: ${{ matrix.target }}
    needs: intel-build
    runs-on: macos-15-intel
    timeout-minutes: 20
    env: *paths
    strategy:
      matrix:
        include:
          - *intel
    defaults: *bash
    steps:
      - *checkout
      - *python
      - *version
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: candidate-${{ matrix.target }}
      # artifacts do not keep file modes
      - run: chmod +x target/${{ matrix.target }}/release/fetchloom
      - *runs
      - *archive
      - *installed
      - *installer
      - *record
      - *sizes
      - *packages
      - *receipts

  source-package:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        if: github.ref_type != 'tag'
        with:
          shared-key: source-package-v2
          save-if: ${{ github.event_name != 'pull_request' }}
      - name: package and install the source distribution
        run: |
          version=$(sed -n 's/^version = "\(.*\)"$/\1/p' Cargo.toml | head -n 1)
          # the install below compiles the packaged sources, so cargo's own verify build would repeat it
          cargo package --locked --no-verify
          mkdir -p .release/source-install
          tar -xzf "target/package/fetchloom-$version.crate" -C .release/source-install
          cargo install --path ".release/source-install/fetchloom-$version" --locked \
            --target-dir "$PWD/target/source-build" --root "$PWD/.release/source-installed"
          python3 python/ci_journey.py --binary .release/source-installed/bin/fetchloom \
            --version "$version" --commit "$FETCHLOOM_COMMIT" --report .release/source-package.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: proof-source-package
          path: .release/source-package.json
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7

  inventory:
    needs: [build, intel, source-package]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: packages-*
          path: dist
          merge-multiple: true
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: proof-*
          path: target/ci-artifacts
      - name: require every target and checked asset
        run: |
          version=$(sed -n 's/^version = "\(.*\)"$/\1/p' Cargo.toml | head -n 1)
          python3 python/check_artifacts.py inventory dist target/ci-artifacts \
            --version "$version" --commit "$FETCHLOOM_COMMIT"
      # every wheel holds the cyclonedx sbom maturin wrote of every crate fetchloom depends on, for
      # any platform; the release attaches the x86_64 linux wheel's and lists it in SHA256SUMS
      - name: take the release sbom from a wheel
        run: |
          version=$(sed -n 's/^version = "\(.*\)"$/\1/p' Cargo.toml | head -n 1)
          python3 python/release_sbom.py dist sbom --version "$version"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sbom
          path: sbom/*
          if-no-files-found: error
          retention-days: 7
