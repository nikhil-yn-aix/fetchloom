name: ci

on:
  push:
    branches: [main, rebuild]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # installs the version and components rust-toolchain.toml pins
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - run: cargo fmt --check
      # advisories, licenses, duplicate crates and sources, as deny.toml sets them. it reads the
      # lock file, which every platform shares, so linux alone runs it
      - uses: taiki-e/install-action@86f7a0ffb25f40114606501a311ebcfaf882ea32 # v2.88.0
        if: runner.os == 'Linux'
        with:
          tool: cargo-deny@0.20.2
      - run: cargo deny --locked check advisories licenses bans sources
        if: runner.os == 'Linux'
      - run: cargo clippy --all-targets --locked -- -D warnings
      - run: cargo test --locked
      # the default disks never show some paths: refs clones blocks, the way apfs does, while
      # exfat and fat32 hold research data on many drives, have no links and refuse to delete a
      # read-only file the way ntfs allows. every test runs again with its folders on each.
      # windows runners are admin, which diskpart needs
      - name: cargo test on refs, exfat and fat32
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $failed = @()
          foreach ($volume in @(@('refs', 'R'), @('exfat', 'X'), @('fat32', 'Y'))) {
            $fs, $letter = $volume
            $vhd = "$env:RUNNER_TEMP\$fs.vhdx"
            $script = "$env:RUNNER_TEMP\$fs.txt"
            Set-Content $script -Encoding ascii -Value @(
              "create vdisk file=`"$vhd`" maximum=4096 type=expandable"
              "select vdisk file=`"$vhd`""
              "attach vdisk"
              "create partition primary"
              "format fs=$fs quick label=$fs"
              "assign letter=$letter"
            )
            diskpart /s $script
            if ($LASTEXITCODE) { throw "diskpart could not make the $fs volume" }
            New-Item -ItemType Directory "${letter}:\tmp" | Out-Null
            $env:TMP = "${letter}:\tmp"
            $env:TEMP = $env:TMP
            Write-Output "::group::cargo test on $fs"
            cargo test --locked --no-fail-fast
            if ($LASTEXITCODE) { $failed += $fs }
            Write-Output "::endgroup::"
          }
          if ($failed) { throw "tests failed on $($failed -join ', ')" }
      # btrfs and xfs clone blocks, a path ext4 never takes
      - name: cargo test on btrfs and xfs
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq btrfs-progs xfsprogs > /dev/null
          failed=""
          for fs in btrfs xfs; do
            image="$RUNNER_TEMP/$fs.img"
            truncate -s 4G "$image"
            "mkfs.$fs" -q "$image"
            sudo mkdir -p "/mnt/$fs"
            sudo mount -o loop "$image" "/mnt/$fs"
            sudo chown "$(id -u):$(id -g)" "/mnt/$fs"
            echo "::group::cargo test on $fs"
            TMPDIR="/mnt/$fs" cargo test --locked --no-fail-fast || failed="$failed $fs"
            echo "::endgroup::"
          done
          if [ -n "$failed" ]; then echo "tests failed on$failed"; exit 1; fi
