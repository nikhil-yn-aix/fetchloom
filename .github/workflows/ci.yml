name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  # the one check branch protection requires, so it names no platform and passes only when
  # every platform did
  ci:
    needs: [test, musl]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - run: |
          test "${{ needs.test.result }}" = success
          test "${{ needs.musl.result }}" = success

  # the linux release ships static musl binaries that use mimalloc, while the test job builds
  # for glibc. this builds each shipped target the way release.yml does and runs it
  musl:
    name: ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-musl
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-musl
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: rustup toolchain install
      - run: rustup target add ${{ matrix.target }}
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      # the cc crate builds zstd, liblzma, ring and mimalloc with musl-gcc for the musl target
      - name: install the musl C compiler
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq musl-tools > /dev/null
      - run: cargo build --locked --release --target ${{ matrix.target }}
      - name: check that the binary runs
        run: |
          version=$(sed -n 's/^version = "\(.*\)"$/\1/p' Cargo.toml | head -n 1)
          said=$(target/${{ matrix.target }}/release/fetchloom --version)
          echo "fetchloom --version: $said"
          if [ "$said" != "fetchloom $version" ]; then
            echo "::error::fetchloom --version printed $said"
            exit 1
          fi

  test:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, ubuntu-24.04-arm, windows-11-arm, macos-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # installs the version and components rust-toolchain.toml pins
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - run: cargo fmt --check
        if: matrix.os == 'ubuntu-latest'
      # advisories, licenses, duplicate crates and sources, as deny.toml sets them. it reads the
      # lock file, which every platform shares, so x86_64 linux alone runs it
      - uses: taiki-e/install-action@86f7a0ffb25f40114606501a311ebcfaf882ea32 # v2.88.0
        if: matrix.os == 'ubuntu-latest'
        with:
          tool: cargo-deny@0.20.2
      - run: cargo deny --locked check advisories licenses bans sources
        if: matrix.os == 'ubuntu-latest'
      - run: cargo clippy --all-targets --locked -- -D warnings
      # code that only tests and debug builds use would be dead in the shipped binary
      - run: cargo clippy --release --locked -- -D warnings
        if: matrix.os == 'ubuntu-latest'
      # the x86_64 macos release is otherwise first compiled when a tag runs release.yml. checking
      # it here also builds its C dependencies for that target
      - name: cargo check for x86_64 macos
        if: matrix.os == 'macos-latest'
        env:
          MACOSX_DEPLOYMENT_TARGET: '11.0'
        run: |
          rustup target add x86_64-apple-darwin
          cargo check --locked --release --target x86_64-apple-darwin
      - run: cargo test --locked
      - run: python3 -m unittest discover -s python
        if: matrix.os == 'ubuntu-latest' || matrix.os == 'macos-latest'
      - run: python -m unittest discover -s python
        if: matrix.os == 'windows-latest'
      # the benchmark harness and its charts need only the standard library
      - name: benchmark harness checks
        if: matrix.os == 'ubuntu-latest'
        run: python3 -m unittest discover -s bench
      # the default disks never show some paths: refs clones blocks, which ntfs never does, while
      # exfat and fat32 hold research data on many drives, have no links and refuse to delete a
      # read-only file the way ntfs allows. tests run again with their folders on each, except
      # those that never touch a disk: parsers, sources, the network and output.
      # windows runners are admin, which diskpart needs
      - name: cargo test on refs, exfat and fat32
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: |
          $failed = @()
          foreach ($volume in @(@('refs', 'R'), @('exfat', 'X'), @('fat32', 'Y'))) {
            $fs, $letter = $volume
            $vhd = "$env:RUNNER_TEMP\$fs.vhdx"
            $script = "$env:RUNNER_TEMP\$fs.txt"
            Set-Content $script -Encoding ascii -Value @(
              "create vdisk file=`"$vhd`" maximum=4096 type=expandable"
              "select vdisk file=`"$vhd`""
              "attach vdisk"
              "create partition primary"
              "format fs=$fs quick label=$fs"
              "assign letter=$letter"
            )
            diskpart /s $script
            if ($LASTEXITCODE) { throw "diskpart could not make the $fs volume" }
            New-Item -ItemType Directory "${letter}:\tmp" | Out-Null
            $env:TMP = "${letter}:\tmp"
            $env:TEMP = $env:TMP
            Write-Output "::group::cargo test on $fs"
            cargo test --locked --no-fail-fast -- --skip source:: --skip net:: --skip glob:: --skip name:: --skip output:: --skip units:: --skip digest:: --skip error:: --skip basics:: --skip hints:: --skip progress:: --skip proxy:: --skip secrets:: --skip split:: --skip search:: --skip caps::
            if ($LASTEXITCODE) { $failed += $fs }
            Write-Output "::endgroup::"
          }
          if ($failed) { throw "tests failed on $($failed -join ', ')" }
      # btrfs and xfs clone blocks, a path ext4 never takes
      - name: cargo test on btrfs and xfs
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq btrfs-progs xfsprogs > /dev/null
          failed=""
          for fs in btrfs xfs; do
            image="$RUNNER_TEMP/$fs.img"
            truncate -s 4G "$image"
            "mkfs.$fs" -q "$image"
            sudo mkdir -p "/mnt/$fs"
            sudo mount -o loop "$image" "/mnt/$fs"
            sudo chown "$(id -u):$(id -g)" "/mnt/$fs"
            echo "::group::cargo test on $fs"
            TMPDIR="/mnt/$fs" cargo test --locked --no-fail-fast -- --skip source:: --skip net:: --skip glob:: --skip name:: --skip output:: --skip units:: --skip digest:: --skip error:: --skip basics:: --skip hints:: --skip progress:: --skip proxy:: --skip secrets:: --skip split:: --skip search:: --skip caps:: || failed="$failed $fs"
            echo "::endgroup::"
          done
          if [ -n "$failed" ]; then echo "tests failed on$failed"; exit 1; fi
      # apfs keeps a name in the unicode composition it was given, while hfs+, on many older
      # external drives, lists every name decomposed. both see the two compositions as one name
      - name: cargo test on hfs+
        if: matrix.os == 'macos-latest'
        run: |
          hdiutil create -quiet -size 4g -fs HFS+ -volname hfs "$RUNNER_TEMP/hfs.dmg"
          hdiutil attach -quiet -nobrowse -mountpoint "$RUNNER_TEMP/hfs" "$RUNNER_TEMP/hfs.dmg"
          TMPDIR="$RUNNER_TEMP/hfs" cargo test --locked --no-fail-fast -- --skip source:: --skip net:: --skip glob:: --skip name:: --skip output:: --skip units:: --skip digest:: --skip error:: --skip basics:: --skip hints:: --skip progress:: --skip proxy:: --skip secrets:: --skip split:: --skip search:: --skip caps::
