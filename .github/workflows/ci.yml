name: ci

on:
  push:
    branches: [main, rebuild]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # installs the version and components rust-toolchain.toml pins
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - run: cargo fmt --check
      - run: cargo clippy --all-targets --locked -- -D warnings
      - run: cargo test --locked
      # research data often sits on exfat or fat32 drives, which have no links and refuse to
      # delete a read-only file the way ntfs allows. every test runs again with its folders on
      # each. windows runners are admin, which diskpart needs
      - name: cargo test on exfat and fat32
        if: runner.os == 'Windows'
        continue-on-error: true
        shell: pwsh
        run: |
          $failed = $false
          foreach ($fs in 'exfat', 'fat32') {
            $vhd = "$env:RUNNER_TEMP\$fs.vhdx"
            $letter = if ($fs -eq 'exfat') { 'X' } else { 'Y' }
            $script = "$env:RUNNER_TEMP\$fs.txt"
            Set-Content $script -Encoding ascii -Value @(
              "create vdisk file=`"$vhd`" maximum=4096 type=expandable"
              "select vdisk file=`"$vhd`""
              "attach vdisk"
              "create partition primary"
              "format fs=$fs quick label=$fs"
              "assign letter=$letter"
            )
            diskpart /s $script
            if ($LASTEXITCODE) { throw "diskpart could not make the $fs volume" }
            New-Item -ItemType Directory "${letter}:\tmp" | Out-Null
            $env:TMP = "${letter}:\tmp"
            $env:TEMP = $env:TMP
            Write-Output "::group::cargo test on $fs"
            cargo test --locked
            if ($LASTEXITCODE) { $failed = $true }
            Write-Output "::endgroup::"
          }
          if ($failed) { exit 1 }
