name: ci

on:
  push:
    branches: [main]
  pull_request:
  merge_group:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}-${{ github.event_name == 'pull_request' && github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  CARGO_BUILD_JOBS: 4
  RUST_TEST_THREADS: 4
  INSTA_UPDATE: 'no'
  INSTA_FORCE_PASS: '0'

jobs:
  ci:
    needs: [quality, docs, test, windows, windows-build, windows-fs, snapshots, artifacts]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: require every prerequisite
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          python3 - <<'PY'
          import json, os
          results = json.loads(os.environ['RESULTS'])
          for name, result in results.items():
              print(f"{name}: {result['result']}")
          if not results or any(result['result'] != 'success' for result in results.values()):
              raise SystemExit('every required job must succeed')
          PY

  quality:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          cache-targets: false
          save-if: ${{ github.event_name != 'pull_request' }}
      - uses: taiki-e/install-action@cfdb7ed4ccc7c7dce37759eae89dc5674b469b39 # v2.90.3
        if: always()
        with:
          tool: cargo-deny@0.20.2,zizmor@1.32.0,cargo-machete@0.9.2,typos-cli@1.52.0,shellcheck@0.11.0
      - name: fmt
        if: always()
        run: cargo fmt --all -- --check
      - name: cargo-deny
        if: always()
        run: cargo deny --locked check advisories licenses bans sources
      - name: zizmor
        if: always()
        run: zizmor --offline --strict-collection .github
      - name: machete
        if: always()
        run: |
          cargo machete --with-metadata
          git diff --exit-code -- Cargo.lock
      - name: typos
        if: always()
        run: typos
      - name: shellcheck
        if: always()
        run: shellcheck -s dash install.sh && shellcheck .github/scripts/apt-install.sh .github/scripts/macos-filesystem.sh
      - name: PSScriptAnalyzer
        if: always()
        shell: pwsh
        run: |
          if (-not (Get-Module -ListAvailable PSScriptAnalyzer | Where-Object Version -EQ '1.25.0')) {
            Install-Module PSScriptAnalyzer -RequiredVersion 1.25.0 -Scope CurrentUser -Force -Repository PSGallery
          }
          Import-Module PSScriptAnalyzer -RequiredVersion 1.25.0
          # the installer targets 5.1+, where Write-Host is redirectable progress, not pipeline data.
          $issues = @(Invoke-ScriptAnalyzer -Path install.ps1 -Severity Warning,Error -ExcludeRule PSAvoidUsingWriteHost)
          $issues | Format-Table -AutoSize
          if ($issues.Count) { throw "PSScriptAnalyzer found $($issues.Count) issues" }
      - name: benchmark harness tests
        if: always()
        run: python3 -m unittest discover -s bench

  docs:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: python documentation tests
        run: |
          python3 -m unittest discover -s python -p test_docs.py
          python3 -m unittest discover -s python -p test_site.py
          python3 -m unittest discover -s python -p test_transcript.py
          python3 -m unittest discover -s python -p test_ci.py
          python3 -m unittest discover -s python -p test_snapshots.py
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        if: always()
        with:
          version: 0.13.7
          checksum: c5221ff41b7892bfc223543883600125f6a47fe845093e0f5bdff4f359196d83
          enable-cache: false
      - name: install the site's toolchain
        if: always()
        run: uv sync --locked --project docs-site
      - name: draw the site's icons and link card with the toolchain's pillow
        if: always()
        run: uv run --locked --project docs-site python -m unittest discover -s python -p test_site.py
      - uses: taiki-e/install-action@cfdb7ed4ccc7c7dce37759eae89dc5674b469b39 # v2.90.3
        if: always()
        with:
          tool: lychee@0.24.2
      - name: build the site and agent exports
        if: always()
        run: uv run --locked --project docs-site python python/build_site.py
      - name: check the addresses fetchloom prints, heading ids and requests
        if: always()
        run: python3 python/check_site.py site
      - name: check rendered links and anchors
        if: always()
        run: |
          test -s site/index.html
          # the 404 page links /fetchloom/..., where pages serves the site
          mkdir -p "$RUNNER_TEMP/pages"
          ln -s "$GITHUB_WORKSPACE/site" "$RUNNER_TEMP/pages/fetchloom"
          lychee --offline --include-fragments=anchor-only --no-ignore --index-files index.html --root-dir "$RUNNER_TEMP/pages" 'site/**/*.html'

  artifacts:
    uses: $/.github/workflows/artifacts.yml

  test:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        # what each runner has, so a test that lacks one fails rather than skips
        include:
          - os: ubuntu-24.04
            require: script,git,hardlinks,placed-hardlinks,raw-names,distinct-names,unprivileged,symlinks,birth-time,freed-names,sparse-files,file-locks,bash,pwsh,fish
          - os: ubuntu-24.04-arm
            require: script,git,hardlinks,placed-hardlinks,raw-names,distinct-names,unprivileged,symlinks,birth-time,freed-names,sparse-files,file-locks,bash
          - os: windows-11-arm
            require: git,hardlinks
          - os: macos-15
            require: script,git,hardlinks,unprivileged,pwsh,zsh
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          save-if: ${{ github.event_name != 'pull_request' }}
      - uses: taiki-e/install-action@cfdb7ed4ccc7c7dce37759eae89dc5674b469b39 # v2.90.3
        with:
          tool: cargo-nextest@0.9.151
      # the crate has no code that differs by processor, so the arm64 linux and windows runners
      # would lint what the x86_64 jobs of their system already lint
      - run: cargo clippy --all-targets --locked -- -D warnings
        if: matrix.os == 'ubuntu-24.04' || matrix.os == 'macos-15'
      - run: cargo clippy --release --locked -- -D warnings
        if: matrix.os == 'ubuntu-24.04'
      - run: cargo build --locked --example recipe_step
      - name: record cargo test selections
        run: python3 python/ci_tests.py record
      - name: install fish for the quoting test
        if: matrix.os == 'ubuntu-24.04'
        run: .github/scripts/apt-install.sh fish
      - name: nextest
        env:
          FETCHLOOM_TEST_REQUIRE: ${{ matrix.require }}
        run: python3 python/ci_tests.py run native
      - name: rustdoc
        if: matrix.os == 'ubuntu-24.04'
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo doc --locked --no-deps
      - run: python3 -m unittest discover -s python
        if: matrix.os == 'ubuntu-24.04' || matrix.os == 'macos-15'
      - name: tests on btrfs and xfs
        if: matrix.os == 'ubuntu-24.04'
        timeout-minutes: 12
        run: |
          echo 'btrfs/xfs: provisioning and both suites have a 12-minute step limit'
          trap 'echo "::error::btrfs/xfs step was interrupted or reached its 12-minute limit"; exit 124' TERM
          .github/scripts/apt-install.sh btrfs-progs xfsprogs
          trap 'for fs in btrfs xfs; do sudo umount "/mnt/fetchloom-$fs" 2>/dev/null || true; done' EXIT
          failed=""
          for fs in btrfs xfs; do
            echo "$fs: create, format and mount the test image"
            image="$RUNNER_TEMP/$fs.img"
            truncate -s 4G "$image"
            "mkfs.$fs" -q "$image"
            sudo mkdir -p "/mnt/fetchloom-$fs"
            sudo mount -o loop "$image" "/mnt/fetchloom-$fs"
            sudo chown "$(id -u):$(id -g)" "/mnt/fetchloom-$fs"
            test "$(findmnt -no FSTYPE "/mnt/fetchloom-$fs")" = "$fs"
            echo "$fs: run the selected filesystem tests"
            TMPDIR="/mnt/fetchloom-$fs" python3 python/ci_tests.py run "$fs" --disk || failed="$failed $fs"
            echo "$fs: detach the test image"
            sudo umount "/mnt/fetchloom-$fs"
            rm "$image"
          done
          test -z "$failed"
      - name: writable copy on a chmod-refusing drive
        if: matrix.os == 'ubuntu-24.04'
        run: |
          .github/scripts/apt-install.sh dosfstools
          truncate -s 64M "$RUNNER_TEMP/fat.img"
          mkfs.vfat "$RUNNER_TEMP/fat.img" > /dev/null
          sudo mkdir -p /mnt/fetchloom-fat
          sudo mount -o loop,umask=000 "$RUNNER_TEMP/fat.img" /mnt/fetchloom-fat
          trap 'sudo umount /mnt/fetchloom-fat' EXIT
          test "$(findmnt -no FSTYPE /mnt/fetchloom-fat)" = vfat
          FETCHLOOM_TEST_NOOP_CHMOD=/mnt/fetchloom-fat python3 python/ci_tests.py run chmod --chmod
      - name: alias tests in a folder that ignores case
        if: matrix.os == 'ubuntu-24.04'
        run: |
          truncate -s 128M "$RUNNER_TEMP/casefold.img"
          mkfs.ext4 -q -O casefold "$RUNNER_TEMP/casefold.img"
          sudo mkdir -p /mnt/fetchloom-casefold
          sudo mount -o loop "$RUNNER_TEMP/casefold.img" /mnt/fetchloom-casefold
          trap 'sudo umount /mnt/fetchloom-casefold' EXIT
          # an empty folder takes the flag, and everything made in it then ignores case
          folder=/mnt/fetchloom-casefold/tmp
          sudo mkdir "$folder"
          sudo chattr +F "$folder"
          sudo chown "$(id -u):$(id -g)" "$folder"
          touch "$folder/probe"
          test -e "$folder/PROBE" || { echo "::error::$folder tells case apart"; exit 1; }
          rm "$folder/probe"
          TMPDIR="$folder" FETCHLOOM_TEST_REQUIRE=aliases python3 python/ci_tests.py run aliases --aliases
      - name: tests on hfs+
        if: matrix.os == 'macos-15'
        timeout-minutes: 12
        run: .github/scripts/macos-filesystem.sh
      - name: keep test reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: tests-${{ matrix.os }}-${{ github.run_attempt }}
          path: target/ci/
          if-no-files-found: warn
          retention-days: 7

  windows:
    name: windows-2025
    runs-on: windows-2025
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: test
          save-if: ${{ github.event_name != 'pull_request' }}
      - uses: taiki-e/install-action@cfdb7ed4ccc7c7dce37759eae89dc5674b469b39 # v2.90.3
        with:
          tool: cargo-nextest@0.9.151
      - run: cargo clippy --all-targets --locked -- -D warnings
      - run: cargo build --locked --example recipe_step
      - name: record cargo test selections
        run: python python/ci_tests.py record
      - name: nextest
        env:
          FETCHLOOM_TEST_REQUIRE: git,hardlinks,pwsh
        run: python python/ci_tests.py run native
      - run: python -m unittest discover -s python
      - name: keep test reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: tests-windows-2025-${{ github.run_attempt }}
          path: |
            target/ci/native/
            target/ci/selection.json
          if-no-files-found: warn
          retention-days: 7

  # the volume jobs need only the test build, so a second runner builds and archives it while
  # the windows job above runs the native suite
  windows-build:
    name: windows test build
    runs-on: windows-2025
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: test
          # the windows job saves this cache
          save-if: false
      - uses: taiki-e/install-action@cfdb7ed4ccc7c7dce37759eae89dc5674b469b39 # v2.90.3
        with:
          tool: cargo-nextest@0.9.151
      - run: cargo build --locked --example recipe_step
      - name: record cargo test selections
        run: python python/ci_tests.py record
      - name: archive the windows test build
        run: cargo nextest archive --locked --tests --profile ci --archive-file target/ci/windows-tests.tar.zst
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: windows-test-build
          path: |
            target/ci/windows-tests.tar.zst
            target/ci/selection.json
          if-no-files-found: error
          compression-level: 0
          retention-days: 1

  snapshots:
    needs: [test, windows, windows-fs]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: tests-*
          path: target/ci-reports
      - name: reject unreferenced snapshots
        run: python3 python/check_snapshots.py target/ci-reports

  windows-fs:
    name: windows ${{ matrix.filesystem }}
    needs: windows-build
    runs-on: windows-2025
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        filesystem: [refs, exfat, fat32]
    defaults:
      run:
        working-directory: source
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: source
          persist-credentials: false
      - uses: taiki-e/install-action@cfdb7ed4ccc7c7dce37759eae89dc5674b469b39 # v2.90.3
        with:
          tool: cargo-nextest@0.9.151
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: windows-test-build
          path: source/target/ci
      - name: run the selected tests on the volume
        shell: pwsh
        run: .github/scripts/windows-filesystem.ps1 -FileSystem ${{ matrix.filesystem }}
      - name: keep test reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: tests-windows-${{ matrix.filesystem }}-${{ github.run_attempt }}
          path: source/target/ci/${{ matrix.filesystem }}/
          if-no-files-found: warn
          retention-days: 7
