name: ci

on:
  push:
    branches: [main]
  pull_request:
  merge_group:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}-${{ github.event_name == 'pull_request' && github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  CARGO_BUILD_JOBS: 4
  RUST_TEST_THREADS: 4
  INSTA_UPDATE: 'no'
  INSTA_FORCE_PASS: '0'

jobs:
  ci:
    needs: [quality, docs, test, windows, windows-fs, snapshots, artifacts]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: require every prerequisite
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          python3 - <<'PY'
          import json, os
          results = json.loads(os.environ['RESULTS'])
          for name, result in results.items():
              print(f"{name}: {result['result']}")
          if not results or any(result['result'] != 'success' for result in results.values()):
              raise SystemExit('every required job must succeed')
          PY

  quality:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          cache-targets: false
          save-if: ${{ github.event_name != 'pull_request' }}
      - uses: taiki-e/install-action@cfdb7ed4ccc7c7dce37759eae89dc5674b469b39 # v2.90.3
        if: always()
        with:
          tool: cargo-deny@0.20.2,zizmor@1.32.0,cargo-machete@0.9.2,typos-cli@1.52.2,shellcheck@0.11.0
      - name: fmt
        if: always()
        run: cargo fmt --all -- --check
      - name: cargo-deny
        if: always()
        run: cargo deny --locked check advisories licenses bans sources
      - name: zizmor
        if: always()
        run: zizmor --offline --strict-collection .github
      - name: machete
        if: always()
        run: |
          cargo machete --with-metadata
          git diff --exit-code -- Cargo.lock
      - name: typos
        if: always()
        run: typos
      - name: shellcheck
        if: always()
        run: shellcheck -s dash install.sh && shellcheck .github/scripts/apt-install.sh .github/scripts/macos-filesystem.sh
      - name: PSScriptAnalyzer
        if: always()
        shell: pwsh
        run: |
          if (-not (Get-Module -ListAvailable PSScriptAnalyzer | Where-Object Version -EQ '1.25.0')) {
            Install-Module PSScriptAnalyzer -RequiredVersion 1.25.0 -Scope CurrentUser -Force -Repository PSGallery
          }
          Import-Module PSScriptAnalyzer -RequiredVersion 1.25.0
          # the installer targets 5.1+, where Write-Host is redirectable progress, not pipeline data.
          $issues = @(Invoke-ScriptAnalyzer -Path install.ps1 -Severity Warning,Error -ExcludeRule PSAvoidUsingWriteHost)
          $issues | Format-Table -AutoSize
          if ($issues.Count) { throw "PSScriptAnalyzer found $($issues.Count) issues" }
      - name: benchmark harness tests
        if: always()
        run: python3 -m unittest discover -s bench

  docs:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      MDBOOK_VERSION: 0.5.4
      MDBOOK_SHA256: 3f28de05dafca9d0f2eab99c662116b0e37b89b1d96a08f8f430b9eeae958cd7
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: python documentation tests
        run: |
          python3 -m unittest discover -s python -p test_docs.py
          python3 -m unittest discover -s python -p test_site.py
          python3 -m unittest discover -s python -p test_ci.py
          python3 -m unittest discover -s python -p test_snapshots.py
      - name: install mdbook
        if: always()
        run: |
          archive="mdbook-v${MDBOOK_VERSION}-x86_64-unknown-linux-gnu.tar.gz"
          curl --fail --silent --show-error --location --retry 3 --output "$RUNNER_TEMP/$archive" \
            "https://github.com/rust-lang/mdBook/releases/download/v${MDBOOK_VERSION}/$archive"
          echo "$MDBOOK_SHA256  $RUNNER_TEMP/$archive" | sha256sum --check --strict
          mkdir -p "$RUNNER_TEMP/mdbook"
          tar -xzf "$RUNNER_TEMP/$archive" -C "$RUNNER_TEMP/mdbook" mdbook
          echo "$RUNNER_TEMP/mdbook" >> "$GITHUB_PATH"
      - uses: taiki-e/install-action@cfdb7ed4ccc7c7dce37759eae89dc5674b469b39 # v2.90.3
        if: always()
        with:
          tool: lychee@0.24.2
      - name: build the site and agent exports
        if: always()
        run: python3 python/build_site.py --dest-dir site/fetchloom
      - name: check rendered links and anchors
        if: always()
        run: |
          test -s site/fetchloom/index.html
          lychee --offline --include-fragments=anchor-only --no-ignore --root-dir "$GITHUB_WORKSPACE/site" 'site/fetchloom/**/*.html'

  artifacts:
    uses: $/.github/workflows/artifacts.yml

  test:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-24.04-arm, windows-11-arm, macos-15]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          save-if: ${{ github.event_name != 'pull_request' }}
      - uses: taiki-e/install-action@cfdb7ed4ccc7c7dce37759eae89dc5674b469b39 # v2.90.3
        with:
          tool: cargo-nextest@0.9.151
      - run: cargo clippy --all-targets --locked -- -D warnings
      - run: cargo clippy --release --locked -- -D warnings
        if: matrix.os == 'ubuntu-24.04'
      - run: cargo build --locked --example recipe_step
      - name: record cargo test selections
        run: python3 python/ci_tests.py record
      - name: nextest
        run: python3 python/ci_tests.py run native
      - name: doctests
        run: cargo test --locked --doc
      - name: rustdoc
        if: matrix.os == 'ubuntu-24.04'
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo doc --locked --no-deps
      - name: check that the macos build links only system libraries
        if: matrix.os == 'macos-15'
        run: |
          libraries=$(otool -L target/debug/fetchloom | tail -n +2)
          echo "$libraries"
          if echo "$libraries" | grep -vqE '^[[:space:]]+(/usr/lib/|/System/Library/)'; then
            echo '::error::fetchloom links libraries macos does not ship'
            exit 1
          fi
      - run: python3 -m unittest discover -s python
        if: matrix.os == 'ubuntu-24.04' || matrix.os == 'macos-15'
      - name: tests on btrfs and xfs
        if: matrix.os == 'ubuntu-24.04'
        timeout-minutes: 12
        run: |
          echo 'btrfs/xfs: provisioning and both suites have a 12-minute step limit'
          trap 'echo "::error::btrfs/xfs step was interrupted or reached its 12-minute limit"; exit 124' TERM
          .github/scripts/apt-install.sh btrfs-progs xfsprogs
          trap 'for fs in btrfs xfs; do sudo umount "/mnt/fetchloom-$fs" 2>/dev/null || true; done' EXIT
          failed=""
          for fs in btrfs xfs; do
            echo "$fs: create, format and mount the test image"
            image="$RUNNER_TEMP/$fs.img"
            truncate -s 4G "$image"
            "mkfs.$fs" -q "$image"
            sudo mkdir -p "/mnt/fetchloom-$fs"
            sudo mount -o loop "$image" "/mnt/fetchloom-$fs"
            sudo chown "$(id -u):$(id -g)" "/mnt/fetchloom-$fs"
            test "$(findmnt -no FSTYPE "/mnt/fetchloom-$fs")" = "$fs"
            echo "$fs: run the selected filesystem tests"
            TMPDIR="/mnt/fetchloom-$fs" python3 python/ci_tests.py run "$fs" --disk || failed="$failed $fs"
            echo "$fs: detach the test image"
            sudo umount "/mnt/fetchloom-$fs"
            rm "$image"
          done
          test -z "$failed"
      - name: writable copy on a chmod-refusing drive
        if: matrix.os == 'ubuntu-24.04'
        run: |
          .github/scripts/apt-install.sh dosfstools
          truncate -s 64M "$RUNNER_TEMP/fat.img"
          mkfs.vfat "$RUNNER_TEMP/fat.img" > /dev/null
          sudo mkdir -p /mnt/fetchloom-fat
          sudo mount -o loop,umask=000 "$RUNNER_TEMP/fat.img" /mnt/fetchloom-fat
          trap 'sudo umount /mnt/fetchloom-fat' EXIT
          test "$(findmnt -no FSTYPE /mnt/fetchloom-fat)" = vfat
          FETCHLOOM_TEST_NOOP_CHMOD=/mnt/fetchloom-fat python3 python/ci_tests.py run chmod --chmod
      - name: tests on hfs+
        if: matrix.os == 'macos-15'
        timeout-minutes: 12
        run: .github/scripts/macos-filesystem.sh
      - name: keep test reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: tests-${{ matrix.os }}-${{ github.run_attempt }}
          path: target/ci/
          if-no-files-found: warn
          retention-days: 7

  windows:
    name: windows-2025
    runs-on: windows-2025
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: test
          save-if: ${{ github.event_name != 'pull_request' }}
      - uses: taiki-e/install-action@cfdb7ed4ccc7c7dce37759eae89dc5674b469b39 # v2.90.3
        with:
          tool: cargo-nextest@0.9.151
      - run: cargo clippy --all-targets --locked -- -D warnings
      - run: cargo build --locked --example recipe_step
      - name: record cargo test selections
        run: python python/ci_tests.py record
      - name: nextest
        run: python python/ci_tests.py run native
      - name: doctests
        run: cargo test --locked --doc
      - run: python -m unittest discover -s python
      - name: archive the windows test build
        run: cargo nextest archive --locked --tests --profile ci --archive-file target/ci/windows-tests.tar.zst
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: windows-test-build
          path: |
            target/ci/windows-tests.tar.zst
            target/ci/selection.json
          if-no-files-found: error
          compression-level: 0
          retention-days: 1
      - name: keep test reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: tests-windows-2025-${{ github.run_attempt }}
          path: |
            target/ci/native/
            target/ci/selection.json
          if-no-files-found: warn
          retention-days: 7

  snapshots:
    needs: [test, windows, windows-fs]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: tests-*
          path: target/ci-reports
      - name: reject unreferenced snapshots
        run: python3 python/check_snapshots.py target/ci-reports

  windows-fs:
    name: windows ${{ matrix.filesystem }}
    needs: windows
    runs-on: windows-2025
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        filesystem: [refs, exfat, fat32]
    defaults:
      run:
        working-directory: source
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: source
          persist-credentials: false
      - uses: taiki-e/install-action@cfdb7ed4ccc7c7dce37759eae89dc5674b469b39 # v2.90.3
        with:
          tool: cargo-nextest@0.9.151
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: windows-test-build
          path: source/target/ci
      - name: run the selected tests on the volume
        shell: pwsh
        run: .github/scripts/windows-filesystem.ps1 -FileSystem ${{ matrix.filesystem }}
      - name: keep test reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: tests-windows-${{ matrix.filesystem }}-${{ github.run_attempt }}
          path: source/target/ci/${{ matrix.filesystem }}/
          if-no-files-found: warn
          retention-days: 7
