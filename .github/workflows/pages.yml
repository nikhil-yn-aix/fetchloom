name: pages

# github pages serves one site per repository, so this workflow is the only one that deploys it:
# the docs at the root and the signed apt repository under /apt
on:
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - 'docs-site/**'
      - 'zensical.toml'
      - 'llms.txt'
      - 'skills/**'
      - '.github/workflows/pages.yml'
      - 'python/build_site.py'
      - 'python/check_site.py'
      - 'python/transcript.py'
      # the pin the header and the favicon draw
      - 'src/output.rs'
  release:
    types: [published]
  workflow_dispatch:

permissions: {}

env:
  # uv's version, as ci.yml pins it; python/test_workflows.py keeps the two the same
  PIN_UV: 0.13.7
  PIN_UV_SHA256: c5221ff41b7892bfc223543883600125f6a47fe845093e0f5bdff4f359196d83

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  # the docs toolchain runs here, with no secret and no right to deploy
  site:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      # the site always shows the default branch, even when a release tag starts the run
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/heads/${{ github.event.repository.default_branch }}
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: ${{ env.PIN_UV }}
          checksum: ${{ env.PIN_UV_SHA256 }}
          enable-cache: false
      - name: install the site's toolchain
        run: uv sync --locked --project docs-site
      - name: build the docs and agent exports
        run: uv run --locked --project docs-site python python/build_site.py
      - name: check the addresses fetchloom prints, heading ids and requests
        run: python3 python/check_site.py site
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: site
          path: site/
          if-no-files-found: error
          retention-days: 1

  # adds the signed apt repository to the built site and deploys it. nothing the site's toolchain
  # installed runs beside the apt key, and no repository file either: the job checks out nothing
  pages:
    needs: site
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    permissions:
      contents: read
      attestations: read
      pages: write
      id-token: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: site
          path: site
      - name: find the latest published release
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if tag=$(gh release view --repo "$GITHUB_REPOSITORY" --json tagName --jq .tagName 2> "$RUNNER_TEMP/release.err"); then
            echo "tag=$tag" >> "$GITHUB_OUTPUT"
          elif grep -q 'release not found' "$RUNNER_TEMP/release.err"; then
            echo "::notice::no published release yet, so the site has no apt repository"
          else
            cat "$RUNNER_TEMP/release.err" >&2
            exit 1
          fi
      - name: download and check the debian packages
        if: steps.release.outputs.tag != ''
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.release.outputs.tag }}
        # python/check_release.py's checks, written out since this job runs no repository file:
        # each file once in SHA256SUMS, whose .deb lines name the release's two packages, each a
        # regular file with its SHA-256 and an attestation release.yml made from the tag
        run: |
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --dir dist --pattern '*.deb' --pattern SHA256SUMS
          cd dist
          export LC_ALL=C
          if grep -Evq '^[0-9a-f]{64} [ *][A-Za-z0-9][A-Za-z0-9._+-]*$' SHA256SUMS; then
            echo "::error::SHA256SUMS has a malformed line"
            exit 1
          fi
          if [ -n "$(cut -c67- SHA256SUMS | sort | uniq -d)" ]; then
            echo "::error::SHA256SUMS lists a file twice"
            exit 1
          fi
          mapfile -t listed < <(cut -c67- SHA256SUMS | grep '\.deb$' | sort)
          shopt -s nullglob
          found=(*.deb)
          if [ "${#listed[@]}" -ne 2 ] || [ "${listed[*]}" != "${found[*]}" ]; then
            echo "::error::SHA256SUMS lists ${listed[*]:-no package} and the release has ${found[*]:-no package}, not the same two debian packages"
            exit 1
          fi
          for deb in "${listed[@]}"; do
            if [ -L "$deb" ] || [ ! -f "$deb" ]; then
              echo "::error::$deb is not a regular file"
              exit 1
            fi
          done
          grep '\.deb$' SHA256SUMS | sha256sum --check --strict
          for deb in "${listed[@]}"; do
            gh attestation verify "$deb" --repo "$GITHUB_REPOSITORY" \
              --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/release.yml" --source-ref "refs/tags/$TAG" --deny-self-hosted-runners
          done
      # a flat repository: `deb [signed-by=...] https://nikhil-yn-aix.github.io/fetchloom/apt ./`.
      # the signed Release lists every .deb under apt/, so the folder must start empty here
      - name: build the signed apt repository
        if: steps.release.outputs.tag != ''
        env:
          APT_SIGNING_KEY: ${{ secrets.APT_SIGNING_KEY }}
        run: |
          export GNUPGHOME="$RUNNER_TEMP/gnupg"
          install -d -m 700 "$GNUPGHOME"
          printf '%s\n' "$APT_SIGNING_KEY" | gpg --batch --quiet --import
          mkdir site/apt
          cp dist/*.deb site/apt/
          cd site/apt
          apt-ftparchive packages . > Packages
          gzip -9 --keep --no-name Packages
          apt-ftparchive -o APT::FTPArchive::Release::Origin=fetchloom \
            -o APT::FTPArchive::Release::Label=fetchloom release . > Release
          gpg --batch --yes --armor --detach-sign --output Release.gpg Release
          gpg --batch --yes --clearsign --output InRelease Release
          gpg --batch --export > fetchloom.gpg
          ls -l
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: site
      - id: deploy
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
