name: pages

# github pages serves one site per repository, so this workflow is the only one that deploys it:
# the mdbook docs at the root and the signed apt repository under /apt
on:
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - 'book.toml'
      - 'llms.txt'
      - 'skills/**'
      - '.github/workflows/pages.yml'
  release:
    types: [published]
  workflow_dispatch:

permissions: {}

concurrency:
  group: pages
  cancel-in-progress: false

env:
  MDBOOK_VERSION: 0.5.4
  MDBOOK_SHA256: 3f28de05dafca9d0f2eab99c662116b0e37b89b1d96a08f8f430b9eeae958cd7
  SITE_URL: https://nikhil-yn-aix.github.io/fetchloom/

jobs:
  pages:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    permissions:
      contents: read
      pages: write
      id-token: write
    steps:
      # the site always shows the default branch, even when a release tag starts the run
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - name: install mdbook
        run: |
          archive="mdbook-v${MDBOOK_VERSION}-x86_64-unknown-linux-gnu.tar.gz"
          curl --fail --silent --show-error --location --retry 3 --output "$RUNNER_TEMP/$archive" \
            "https://github.com/rust-lang/mdBook/releases/download/v${MDBOOK_VERSION}/$archive"
          echo "$MDBOOK_SHA256  $RUNNER_TEMP/$archive" | sha256sum --check --strict
          mkdir -p "$RUNNER_TEMP/mdbook"
          tar -xzf "$RUNNER_TEMP/$archive" -C "$RUNNER_TEMP/mdbook" mdbook
          echo "$RUNNER_TEMP/mdbook" >> "$GITHUB_PATH"
      - name: build the docs
        run: mdbook build
      - name: add the agent files
        run: |
          cp -R skills site/skills
          python3 - <<'EOF'
          import os, pathlib, re

          site = pathlib.Path('site')
          site_url = os.environ['SITE_URL']
          blob = 'https://github.com/nikhil-yn-aix/fetchloom/blob/main/'

          # llms.txt links are relative to the repository root; point them at the site or github
          def relink(m):
              label, url = m.group(1), m.group(2)
              if re.match(r'[a-z]+:', url):
                  return m.group(0)
              path, sep, fragment = url.partition('#')
              if path.startswith('docs/') and path.endswith('.md'):
                  url = path[len('docs/'):-len('.md')] + '.html' + sep + fragment
              elif not path.startswith('skills/'):
                  url = blob + url
              return f'[{label}]({url})'

          llms = re.sub(r'\[([^\]]*)\]\(([^)\s]+)\)', relink, pathlib.Path('llms.txt').read_text(encoding='utf-8'))
          llms = llms.rstrip('\n') + '\n\n## optional\n\n- [full user guide](llms-full.txt): every user guide page in one file\n'
          (site / 'llms.txt').write_text(llms, encoding='utf-8')

          pages = re.findall(r'\]\((user/[^)\s]+\.md)\)', pathlib.Path('docs/SUMMARY.md').read_text(encoding='utf-8'))
          if not pages:
              raise SystemExit('docs/SUMMARY.md lists no user guide pages')
          parts = [f'# fetchloom user guide\n\nevery page of the fetchloom user guide in reading order, from {site_url}user/README.html\n']
          for page in pages:
              body = pathlib.Path('docs', page).read_text(encoding='utf-8').strip()
              parts.append(f'---\n\nsource: {site_url}{page[:-len(".md")]}.html\n\n{body}\n')
          (site / 'llms-full.txt').write_text('\n'.join(parts), encoding='utf-8')
          print(f'llms-full.txt has {len(pages)} pages')
          EOF
      - name: find the latest published release
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if tag=$(gh release view --repo "$GITHUB_REPOSITORY" --json tagName --jq .tagName 2> "$RUNNER_TEMP/release.err"); then
            echo "tag=$tag" >> "$GITHUB_OUTPUT"
          elif grep -q 'release not found' "$RUNNER_TEMP/release.err"; then
            echo "::notice::no published release yet, so the site has no apt repository"
          else
            cat "$RUNNER_TEMP/release.err" >&2
            exit 1
          fi
      - name: download the debian packages
        if: steps.release.outputs.tag != ''
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.release.outputs.tag }}
        run: |
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --dir dist --pattern '*.deb' --pattern SHA256SUMS
          cd dist
          sha256sum --check --ignore-missing SHA256SUMS
      # a flat repository: `deb [signed-by=...] https://nikhil-yn-aix.github.io/fetchloom/apt ./`
      - name: build the signed apt repository
        if: steps.release.outputs.tag != ''
        env:
          APT_SIGNING_KEY: ${{ secrets.APT_SIGNING_KEY }}
        run: |
          export GNUPGHOME="$RUNNER_TEMP/gnupg"
          install -d -m 700 "$GNUPGHOME"
          printf '%s\n' "$APT_SIGNING_KEY" | gpg --batch --quiet --import
          mkdir -p site/apt
          cp dist/*.deb site/apt/
          cd site/apt
          apt-ftparchive packages . > Packages
          gzip -9 --keep --no-name Packages
          apt-ftparchive -o APT::FTPArchive::Release::Origin=fetchloom \
            -o APT::FTPArchive::Release::Label=fetchloom release . > Release
          gpg --batch --yes --armor --detach-sign --output Release.gpg Release
          gpg --batch --yes --clearsign --output InRelease Release
          gpg --batch --export > fetchloom.gpg
          ls -l
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: site
      - id: deploy
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
