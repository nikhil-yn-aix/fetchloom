name: pages

# github pages serves one site per repository, so this workflow is the only one that deploys it:
# the docs at the root and the signed apt repository under /apt
on:
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - 'docs-site/**'
      - 'zensical.toml'
      - 'llms.txt'
      - 'skills/**'
      - '.github/workflows/pages.yml'
      - 'python/build_site.py'
      - 'python/transcript.py'
  release:
    types: [published]
  workflow_dispatch:

permissions: {}

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  pages:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    permissions:
      contents: read
      pages: write
      id-token: write
    steps:
      # the site always shows the default branch, even when a release tag starts the run
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: 0.13.7
          checksum: c5221ff41b7892bfc223543883600125f6a47fe845093e0f5bdff4f359196d83
          enable-cache: false
      - name: install the site's toolchain
        run: uv sync --locked --project docs-site
      - name: build the docs and agent exports
        run: uv run --locked --project docs-site python python/build_site.py
      - name: find the latest published release
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if tag=$(gh release view --repo "$GITHUB_REPOSITORY" --json tagName --jq .tagName 2> "$RUNNER_TEMP/release.err"); then
            echo "tag=$tag" >> "$GITHUB_OUTPUT"
          elif grep -q 'release not found' "$RUNNER_TEMP/release.err"; then
            echo "::notice::no published release yet, so the site has no apt repository"
          else
            cat "$RUNNER_TEMP/release.err" >&2
            exit 1
          fi
      - name: download the debian packages
        if: steps.release.outputs.tag != ''
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.release.outputs.tag }}
        run: |
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --dir dist --pattern '*.deb' --pattern SHA256SUMS
          python3 python/check_release.py dist --suffix .deb --count 2
      # a flat repository: `deb [signed-by=...] https://nikhil-yn-aix.github.io/fetchloom/apt ./`
      - name: build the signed apt repository
        if: steps.release.outputs.tag != ''
        env:
          APT_SIGNING_KEY: ${{ secrets.APT_SIGNING_KEY }}
        run: |
          export GNUPGHOME="$RUNNER_TEMP/gnupg"
          install -d -m 700 "$GNUPGHOME"
          printf '%s\n' "$APT_SIGNING_KEY" | gpg --batch --quiet --import
          mkdir -p site/apt
          cp dist/*.deb site/apt/
          cd site/apt
          apt-ftparchive packages . > Packages
          gzip -9 --keep --no-name Packages
          apt-ftparchive -o APT::FTPArchive::Release::Origin=fetchloom \
            -o APT::FTPArchive::Release::Label=fetchloom release . > Release
          gpg --batch --yes --armor --detach-sign --output Release.gpg Release
          gpg --batch --yes --clearsign --output InRelease Release
          gpg --batch --export > fetchloom.gpg
          ls -l
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: site
      - id: deploy
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
