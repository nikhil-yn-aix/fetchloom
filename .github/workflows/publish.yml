name: publish

# runs when a draft release from release.yml is published, so nothing reaches a package index
# before the release is checked by hand
on:
  release:
    types: [published]

permissions: {}

concurrency:
  group: publish-${{ github.event.release.tag_name }}

env:
  TAG: ${{ github.event.release.tag_name }}

jobs:
  pypi:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: pypi
      url: https://pypi.org/project/fetchloom/
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.release.tag_name }}
          persist-credentials: false
      - name: download the wheels
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --dir dist --pattern '*.whl' --pattern SHA256SUMS
          python3 python/check_release.py dist --suffix .whl --count 6
          rm dist/SHA256SUMS
      - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3

  crates:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment:
      name: crates
      url: https://crates.io/crates/fetchloom
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.release.tag_name }}
          persist-credentials: false
      - run: rustup toolchain install
      - name: publish to crates.io
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        # crates.io still uses the scoped token until its trusted publisher is configured.
        run: cargo publish --locked # zizmor: ignore[use-trusted-publishing]
