name: publish

# runs when a draft release from release.yml is published, so nothing reaches a package index
# before the release is checked by hand
on:
  release:
    types: [published]

permissions: {}

concurrency:
  group: publish-${{ github.event.release.tag_name }}

env:
  TAG: ${{ github.event.release.tag_name }}

jobs:
  pypi:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: pypi
      url: https://pypi.org/project/fetchloom/
    permissions:
      contents: read
      id-token: write
    steps:
      - name: download the wheels
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --dir dist --pattern '*.whl' --pattern SHA256SUMS
          cd dist
          sha256sum --check --ignore-missing SHA256SUMS
          rm SHA256SUMS
      - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3

  crates:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.release.tag_name }}
          persist-credentials: false
      - run: rustup toolchain install
      - name: publish to crates.io
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: cargo publish --locked

  apt:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}apt/
    permissions:
      contents: read
      pages: write
      id-token: write
    steps:
      - name: download the debian packages
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --dir dist --pattern '*.deb' --pattern SHA256SUMS
          cd dist
          sha256sum --check --ignore-missing SHA256SUMS
      # a flat repository: `deb [signed-by=...] https://nikhil-yn-aix.github.io/fetchloom/apt ./`
      - name: build the signed apt repository
        env:
          APT_SIGNING_KEY: ${{ secrets.APT_SIGNING_KEY }}
        run: |
          export GNUPGHOME="$RUNNER_TEMP/gnupg"
          install -d -m 700 "$GNUPGHOME"
          printf '%s\n' "$APT_SIGNING_KEY" | gpg --batch --quiet --import
          mkdir -p site/apt
          cp dist/*.deb site/apt/
          cd site/apt
          apt-ftparchive packages . > Packages
          gzip -9 --keep --no-name Packages
          apt-ftparchive -o APT::FTPArchive::Release::Origin=fetchloom \
            -o APT::FTPArchive::Release::Label=fetchloom release . > Release
          gpg --batch --yes --armor --detach-sign --output Release.gpg Release
          gpg --batch --yes --clearsign --output InRelease Release
          gpg --batch --export > fetchloom.gpg
          ls -l
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: site
      - id: deploy
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
