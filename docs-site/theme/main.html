{% extends "base.html" %}
{% block extrahead %}
  <link rel="preload" href="{{ 'assets/fonts/source-serif-4-latin-wght-normal.woff2' | url }}" as="font" type="font/woff2" crossorigin>
{% endblock %}
{% block scripts %}
  <script>
    // the search dialog draws in a shadow root of its own, out of the stylesheet's reach
    new MutationObserver(function (changes) {
      changes.forEach(function (change) {
        change.addedNodes.forEach(function (node) {
          if (node.shadowRoot) {
            var style = document.createElement("style");
            style.textContent = "*, *::before, *::after { border-radius: 0 !important; box-shadow: none !important;"
              + " -webkit-backdrop-filter: none !important; backdrop-filter: none !important;"
              + " --alpha-light: 1 !important; --alpha-lighter: .9 !important; }"
              + " [id$='-path'] { opacity: 1 !important; color: rgb(var(--color-foreground) / .72) !important; }";
            node.shadowRoot.append(style);
          }
        });
      });
    }).observe(document.body, { childList: true });
    // a table wider than its column scrolls in its own box, which a keyboard reaches by tab
    function scrollable() {
      document.querySelectorAll(".md-typeset__scrollwrap").forEach(function (box) {
        if (box.scrollWidth > box.clientWidth) {
          box.tabIndex = 0;
        } else {
          box.removeAttribute("tabindex");
        }
      });
    }
    window.addEventListener("load", scrollable);
    window.addEventListener("resize", scrollable);
  </script>
  {% if page and page.content and 'class="mermaid"' in page.content %}
    <script src="{{ 'assets/javascripts/mermaid.tiny.js' | url }}"></script>
  {% endif %}
  {{ super() }}
{% endblock %}
