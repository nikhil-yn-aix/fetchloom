# the lab's single files at the poor profile, from windows, by the address WSL's eth0 had when the plan was written.
# shape first: wsl -d Ubuntu-24.04 -u root -e bash bench/lab/net.sh poor
name = "lab-poor-windows"
layer = "lab"
profile = "poor"
repetitions = 5

[vars]
lab = "https://172.31.233.169:8443"
py = "C:/Users/t-nikhilyn/AppData/Local/fetchloom-work/bench-venv/Scripts/python.exe"
wrappers = "C:/Users/t-nikhilyn/AppData/Local/fetchloom-work/wt/report/bench/tools"
ca = "C:/Users/t-nikhilyn/AppData/Local/fetchloom-work/lab-ca.crt"
unpack = ""

[[workload]]
id = "file-10m"
expect = "bench/expect/file-10m.sha256"
floor = "curl-sha256"
primary = false
timeout = 1800
tools = ["fetchloom", "curl-sha256", "aria2c", "aria2c-tuned", "pooch", "dvc"]
vars = { url = "{lab}/file-10m.bin", known = "bench/expect/file-10m.sha256" }

[tool.fetchloom]
first = ["fetchloom", "get", "{url}", "-o", "{out}", "--yes"]
second = ["fetchloom", "get", "{url}", "-o", "{out}", "--yes"]
env = { FETCHLOOM_CACHE = "{home}/cache" }
version = ["fetchloom", "--version"]

[tool.curl-sha256]
first = ["{py}", "{wrappers}/curl_sha256.py", "{out}", "{url}", "{known}"]
version = ["curl", "--version"]

[tool.aria2c]
first = ["aria2c", "--no-conf", "-d", "{out}", "{url}"]
version = ["aria2c", "--version"]

[tool.aria2c-tuned]
first = ["aria2c", "--no-conf", "-x", "16", "-s", "16", "-k", "1M", "-d", "{out}", "{url}"]
version = ["aria2c", "--version"]

[tool.pooch]
first = ["{py}", "{wrappers}/pooch_fetch.py", "{out}", "{home}", "{url}", "{known}", "--unpack={unpack}"]
second = ["{py}", "{wrappers}/pooch_fetch.py", "{out}", "{home}", "{url}", "{known}", "--unpack={unpack}"]
env = { REQUESTS_CA_BUNDLE = "{ca}" }
version = ["C:/Users/t-nikhilyn/AppData/Local/fetchloom-work/bench-venv/Scripts/python.exe", "-c", "from importlib.metadata import version; print('pooch', version('pooch'))"]

[tool.dvc]
first = ["{py}", "{wrappers}/dvc_import.py", "{out}", "{home}", "{url}"]
second = ["{py}", "{wrappers}/dvc_import.py", "{out}", "{home}", "{url}", "--again"]
env = { SSL_CERT_FILE = "{ca}" }
ignore = [".dvc/*", "out/*.dvc"]
version = ["C:/Users/t-nikhilyn/AppData/Local/fetchloom-work/bench-venv/Scripts/python.exe", "-c", "from importlib.metadata import version; print('dvc', version('dvc'))"]
