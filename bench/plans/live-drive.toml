# live: a google drive file, fetchloom against gdown, in WSL.
# every tool keeps the files as the source serves them, so fetchloom runs with --no-extract.
# unpacking is compared in the lab. bench/expect-live.py writes the expect files with a first
# verified download before the first block.
name = "live-drive"
layer = "live"
repetitions = 3

[vars]
py = "/home/fl/bench-venv/bin/python"
wrappers = "/mnt/c/Users/t-nikhilyn/AppData/Local/fetchloom-work/wt/report/bench/tools"

[[workload]]
id = "drive-file"
expect = "bench/expect/live/drive-file.sha256"
bytes = 0
timeout = 3600
tools = ["fetchloom", "gdown"]
vars = { ref = "drive:15bpMH3clXwBJf9cdGpXIOgwKwHrg4T--", expect = "bench/expect/live/drive-file.sha256", client = "15bpMH3clXwBJf9cdGpXIOgwKwHrg4T--" }

[tool.fetchloom]
first = ["fetchloom", "get", "{ref}", "-o", "{out}", "--no-extract", "--yes"]
second = ["fetchloom", "get", "{ref}", "-o", "{out}", "--no-extract", "--yes"]
env = { FETCHLOOM_CACHE = "{home}/cache" }
version = ["fetchloom", "--version"]

[tool.gdown]
first = ["{py}", "{wrappers}/gdown_download.py", "{out}", "{home}", "{client}"]
version = ["/home/fl/bench-venv/bin/python", "-c", "from importlib.metadata import version; print('gdown', version('gdown'))"]
