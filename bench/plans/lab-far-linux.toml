# the lab's single files at the far profile, from WSL, using FETCHLOOM_LAB.
# shape first: wsl -d Ubuntu-24.04 -u root -e bash bench/lab/net.sh far
name = "lab-far-linux"
layer = "lab"
profile = "far"
repetitions = 5

[vars]
lab = "{env:FETCHLOOM_LAB}"
py = "{env:FETCHLOOM_BENCH_PY}"
wrappers = "{repo}/bench/tools"
ca = "{env:FETCHLOOM_LAB_CA}"
unpack = ""

[[workload]]
id = "file-10m"
expect = "bench/expect/file-10m.sha256"
floor = "curl-sha256"
primary = false
timeout = 900
tools = ["fetchloom", "curl-sha256", "aria2c", "aria2c-tuned", "pooch", "dvc", "datalad"]
vars = { url = "{lab}/file-10m.bin", known = "{repo}/bench/expect/file-10m.sha256" }

[tool.fetchloom]
first = ["fetchloom", "get", "{url}", "-o", "{out}", "--yes"]
second = ["fetchloom", "get", "{url}", "-o", "{out}", "--yes"]
env = { FETCHLOOM_CACHE = "{home}/cache" }
version = ["fetchloom", "--version"]

[tool.curl-sha256]
first = ["{py}", "{wrappers}/curl_sha256.py", "{out}", "{url}", "{known}"]
version = ["curl", "--version"]

[tool.aria2c]
first = ["aria2c", "--no-conf", "-d", "{out}", "{url}"]
version = ["aria2c", "--version"]

[tool.aria2c-tuned]
first = ["aria2c", "--no-conf", "-x", "16", "-s", "16", "-k", "1M", "-d", "{out}", "{url}"]
version = ["aria2c", "--version"]

[tool.pooch]
first = ["{py}", "{wrappers}/pooch_fetch.py", "{out}", "{home}", "{url}", "{known}", "--unpack={unpack}"]
second = ["{py}", "{wrappers}/pooch_fetch.py", "{out}", "{home}", "{url}", "{known}", "--unpack={unpack}"]
env = { REQUESTS_CA_BUNDLE = "{ca}" }
version = ["{py}", "-c", "from importlib.metadata import version; print('pooch', version('pooch'))"]

[tool.dvc]
first = ["{py}", "{wrappers}/dvc_import.py", "{out}", "{home}", "{url}"]
second = ["{py}", "{wrappers}/dvc_import.py", "{out}", "{home}", "{url}", "--again"]
env = { SSL_CERT_FILE = "{ca}" }
ignore = [".dvc/*", "out/*.dvc"]
version = ["{py}", "-c", "from importlib.metadata import version; print('dvc', version('dvc'))"]

[tool.datalad]
first = ["{py}", "{wrappers}/datalad_download.py", "{out}", "{home}", "{url}"]
env = { REQUESTS_CA_BUNDLE = "{ca}" }
ignore = ["out/.datalad/*", "out/.gitattributes"]
version = ["{py}", "-c", "from importlib.metadata import version; print('datalad', version('datalad'))"]
