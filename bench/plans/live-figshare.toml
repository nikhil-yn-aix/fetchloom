# live: figshare articles, fetchloom against datahugger, pooch, in WSL.
# every tool keeps the files as the source serves them, so fetchloom runs with --no-extract and datahugger with --no-unzip.
# unpacking is compared in the lab. bench/expect-live.py writes the expect files with a first
# verified download before the first block.
name = "live-figshare"
layer = "live"
repetitions = 3

[vars]
py = "/home/fl/bench-venv/bin/python"
wrappers = "{repo}/bench/tools"

[[workload]]
id = "figshare-s"
expect = "bench/expect/live/figshare-s.sha256"
bytes = 321136
timeout = 3600
tools = ["fetchloom", "datahugger", "pooch"]
vars = { ref = "figshare:34744689@1", expect = "{repo}/bench/expect/live/figshare-s.sha256", doi = "10.6084/m9.figshare.34744689.v1" }

[[workload]]
id = "figshare-m"
expect = "bench/expect/live/figshare-m.sha256"
bytes = 171356647
timeout = 3600
tools = ["fetchloom", "datahugger", "pooch"]
vars = { ref = "figshare:34862205@2", expect = "{repo}/bench/expect/live/figshare-m.sha256", doi = "10.6084/m9.figshare.34862205.v2" }

[tool.fetchloom]
first = ["fetchloom", "get", "{ref}", "-o", "{out}", "--no-extract", "--yes"]
second = ["fetchloom", "get", "{ref}", "-o", "{out}", "--no-extract", "--yes"]
env = { FETCHLOOM_CACHE = "{home}/cache" }
version = ["fetchloom", "--version"]

[tool.datahugger]
first = ["{py}", "{wrappers}/datahugger_download.py", "{out}", "{home}", "{doi}", "--no-unzip"]
version = ["/home/fl/bench-venv/bin/python", "-c", "from importlib.metadata import version; print('datahugger', version('datahugger'))"]

[tool.pooch]
first = ["{py}", "{wrappers}/pooch_fetch.py", "{out}", "{home}", "doi:{doi}"]
second = ["{py}", "{wrappers}/pooch_fetch.py", "{out}", "{home}", "doi:{doi}"]
version = ["/home/fl/bench-venv/bin/python", "-c", "from importlib.metadata import version; print('pooch', version('pooch'))"]
