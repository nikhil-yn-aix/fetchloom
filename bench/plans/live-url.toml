# live: plain urls, fetchloom against curl-sha256, pooch, in WSL.
# every tool keeps the files as the source serves them, so fetchloom runs with --no-extract.
# unpacking is compared in the lab. bench/expect-live.py writes the expect files with a first
# verified download before the first block.
name = "live-url"
layer = "live"
repetitions = 3

[vars]
py = "/home/fl/bench-venv/bin/python"
wrappers = "{repo}/bench/tools"

[[workload]]
id = "url-s1"
expect = "bench/expect/live/url-s1.sha256"
bytes = 3858
timeout = 3600
tools = ["fetchloom", "curl-sha256", "pooch"]
vars = { ref = "https://raw.githubusercontent.com/mwaskom/seaborn-data/master/iris.csv", expect = "{repo}/bench/expect/live/url-s1.sha256", url = "https://raw.githubusercontent.com/mwaskom/seaborn-data/master/iris.csv" }

[[workload]]
id = "url-mzip"
expect = "bench/expect/live/url-mzip.sha256"
bytes = 170498071
timeout = 3600
tools = ["fetchloom", "curl-sha256", "pooch"]
vars = { ref = "https://www.cs.toronto.edu/~kriz/cifar-10-python.tar.gz", expect = "{repo}/bench/expect/live/url-mzip.sha256", url = "https://www.cs.toronto.edu/~kriz/cifar-10-python.tar.gz" }

[tool.fetchloom]
first = ["fetchloom", "get", "{ref}", "-o", "{out}", "--no-extract", "--yes"]
second = ["fetchloom", "get", "{ref}", "-o", "{out}", "--no-extract", "--yes"]
env = { FETCHLOOM_CACHE = "{home}/cache" }
version = ["fetchloom", "--version"]

[tool.curl-sha256]
first = ["{py}", "{wrappers}/curl_sha256.py", "{out}", "{url}", "{expect}"]
version = ["curl", "--version"]

[tool.pooch]
first = ["{py}", "{wrappers}/pooch_fetch.py", "{out}", "{home}", "{url}", "{expect}"]
second = ["{py}", "{wrappers}/pooch_fetch.py", "{out}", "{home}", "{url}", "{expect}"]
version = ["/home/fl/bench-venv/bin/python", "-c", "from importlib.metadata import version; print('pooch', version('pooch'))"]
