# live: hugging face datasets, fetchloom against hf, in WSL.
# every tool keeps the files as the source serves them, so fetchloom runs with --no-extract.
# unpacking is compared in the lab. bench/expect-live.py writes the expect files with a first
# verified download before the first block.
name = "live-hf"
layer = "live"
repetitions = 3

[vars]
py = "/home/fl/bench-venv/bin/python"
wrappers = "bench/tools"

[[workload]]
id = "hf-s1"
expect = "bench/expect/live/hf-s1.sha256"
bytes = 91617
timeout = 3600
tools = ["fetchloom", "hf"]
vars = { ref = "hf:datasets/openai/openai_humaneval@7dce6050a7d6d172f3cc5c32aa97f52fa1a2e544", expect = "bench/expect/live/hf-s1.sha256", client = "datasets/openai/openai_humaneval@7dce6050a7d6d172f3cc5c32aa97f52fa1a2e544" }

[[workload]]
id = "hf-szip"
expect = "bench/expect/live/hf-szip.sha256"
bytes = 17948151
timeout = 3600
tools = ["fetchloom", "hf"]
vars = { ref = "hf:datasets/Matthijs/cmu-arctic-xvectors@5c1297a9eb6c91714ea77c0d4ac5aca9b6a952e5", expect = "bench/expect/live/hf-szip.sha256", client = "datasets/Matthijs/cmu-arctic-xvectors@5c1297a9eb6c91714ea77c0d4ac5aca9b6a952e5" }

[[workload]]
id = "hf-m100"
expect = "bench/expect/live/hf-m100.sha256"
bytes = 270035224
timeout = 3600
tools = ["fetchloom", "hf"]
vars = { ref = "hf:datasets/cais/mmlu@c30699e8356da336a370243923dbaf21066bb9fe", expect = "bench/expect/live/hf-m100.sha256", client = "datasets/cais/mmlu@c30699e8356da336a370243923dbaf21066bb9fe" }

[tool.fetchloom]
first = ["fetchloom", "get", "{ref}", "-o", "{out}", "--no-extract", "--yes"]
second = ["fetchloom", "get", "{ref}", "-o", "{out}", "--no-extract", "--yes"]
env = { FETCHLOOM_CACHE = "{home}/cache" }
version = ["fetchloom", "--version"]

[tool.hf]
first = ["{py}", "{wrappers}/hf_download.py", "{out}", "{home}", "{client}"]
second = ["{py}", "{wrappers}/hf_download.py", "{out}", "{home}", "{client}"]
version = ["/home/fl/bench-venv/bin/python", "-c", "from importlib.metadata import version; print('huggingface_hub', version('huggingface_hub'))"]
