# the lab's single files and archives at the home profile, from WSL, over loopback.
# shape first: wsl -d Ubuntu-24.04 -u root -e bash bench/lab/net.sh home
name = "lab-home-linux"
layer = "lab"
profile = "home"
repetitions = 5

[vars]
lab = "https://localhost:8443"
py = "/home/fl/bench-venv/bin/python"
wrappers = "bench/tools"
ca = "/etc/ssl/certs/ca-certificates.crt"
unpack = ""

[[workload]]
id = "file-1g"
expect = "bench/expect/file-1g.sha256"
floor = "curl-sha256"
primary = true
timeout = 1800
tools = ["fetchloom", "curl-sha256", "aria2c", "aria2c-tuned", "pooch", "dvc", "datalad"]
vars = { url = "{lab}/file-1g.bin", known = "bench/expect/file-1g.sha256" }

[[workload]]
id = "file-100m"
expect = "bench/expect/file-100m.sha256"
floor = "curl-sha256"
primary = true
timeout = 600
tools = ["fetchloom", "curl-sha256", "aria2c", "aria2c-tuned", "pooch", "dvc", "datalad"]
vars = { url = "{lab}/file-100m.bin", known = "bench/expect/file-100m.sha256" }

[[workload]]
id = "file-10m"
expect = "bench/expect/file-10m.sha256"
floor = "curl-sha256"
primary = false
timeout = 300
tools = ["fetchloom", "curl-sha256", "aria2c", "aria2c-tuned", "pooch", "dvc", "datalad"]
vars = { url = "{lab}/file-10m.bin", known = "bench/expect/file-10m.sha256" }

[[workload]]
id = "files-10k-zip"
expect = "bench/expect/files-10k.sha256"
floor = "curl-bsdtar"
primary = true
timeout = 900
tools = ["fetchloom", "curl-bsdtar", "pooch"]
vars = { url = "{lab}/files-10k.zip", known = "1b59fd102a6ac655ce47e368edfd3ee0b2443e8be5e858d880064b374907f2ee", unpack = "zip" }

[[workload]]
# pooch.Untar reads with python's tarfile, which has no zstd before python 3.14
id = "files-10k-tar-zst"
expect = "bench/expect/files-10k.sha256"
floor = "curl-bsdtar"
primary = false
timeout = 900
tools = ["fetchloom", "curl-bsdtar"]
vars = { url = "{lab}/files-10k.tar.zst", known = "e953a6f6f59ca231677675fdd25c4b92313b591f74ce9d1baad91502ccd70873" }

[tool.fetchloom]
first = ["fetchloom", "get", "{url}", "-o", "{out}", "--yes"]
second = ["fetchloom", "get", "{url}", "-o", "{out}", "--yes"]
env = { FETCHLOOM_CACHE = "{home}/cache" }
version = ["fetchloom", "--version"]

[tool.curl-sha256]
first = ["{py}", "{wrappers}/curl_sha256.py", "{out}", "{url}", "{known}"]
version = ["curl", "--version"]

[tool.aria2c]
first = ["aria2c", "--no-conf", "-d", "{out}", "{url}"]
version = ["aria2c", "--version"]

[tool.aria2c-tuned]
first = ["aria2c", "--no-conf", "-x", "16", "-s", "16", "-k", "1M", "-d", "{out}", "{url}"]
version = ["aria2c", "--version"]

[tool.pooch]
first = ["{py}", "{wrappers}/pooch_fetch.py", "{out}", "{home}", "{url}", "{known}", "--unpack={unpack}"]
second = ["{py}", "{wrappers}/pooch_fetch.py", "{out}", "{home}", "{url}", "{known}", "--unpack={unpack}"]
env = { REQUESTS_CA_BUNDLE = "{ca}" }
version = ["/home/fl/bench-venv/bin/python", "-c", "from importlib.metadata import version; print('pooch', version('pooch'))"]

[tool.dvc]
first = ["{py}", "{wrappers}/dvc_import.py", "{out}", "{home}", "{url}"]
second = ["{py}", "{wrappers}/dvc_import.py", "{out}", "{home}", "{url}", "--again"]
env = { SSL_CERT_FILE = "{ca}" }
ignore = [".dvc/*", "out/*.dvc"]
version = ["/home/fl/bench-venv/bin/python", "-c", "from importlib.metadata import version; print('dvc', version('dvc'))"]

[tool.datalad]
first = ["{py}", "{wrappers}/datalad_download.py", "{out}", "{home}", "{url}"]
env = { REQUESTS_CA_BUNDLE = "{ca}" }
ignore = ["out/.datalad/*", "out/.gitattributes"]
version = ["/home/fl/bench-venv/bin/python", "-c", "from importlib.metadata import version; print('datalad', version('datalad'))"]

[tool.curl-bsdtar]
first = ["{py}", "{wrappers}/curl_bsdtar.py", "{out}", "{url}"]
ignore = ["*.zip", "*.tar.zst"]
version = ["bsdtar", "--version"]
