# live: dropbox shared links, fetchloom against curl-sha256, in WSL.
# every tool keeps the files as the source serves them, so fetchloom runs with --no-extract.
# unpacking is compared in the lab. bench/expect-live.py writes the expect files with a first
# verified download before the first block.
name = "live-dropbox"
layer = "live"
repetitions = 3

[vars]
py = "{env:FETCHLOOM_BENCH_PY}"
wrappers = "{repo}/bench/tools"

[[workload]]
id = "dropbox-s1"
expect = "bench/expect/live/dropbox-s1.sha256"
bytes = 775543
timeout = 3600
tools = ["fetchloom", "curl-sha256"]
vars = { ref = "https://www.dropbox.com/s/3y96pnutxum3p4v/0569.pdf?dl=1", expect = "{repo}/bench/expect/live/dropbox-s1.sha256", url = "https://www.dropbox.com/s/3y96pnutxum3p4v/0569.pdf?dl=1" }

[[workload]]
id = "dropbox-szip"
expect = "bench/expect/live/dropbox-szip.sha256"
bytes = 8645770
timeout = 3600
tools = ["fetchloom", "curl-sha256"]
vars = { ref = "https://www.dropbox.com/s/33fop57jjq0wwa9/POJ-104.tar.gz?dl=1", expect = "{repo}/bench/expect/live/dropbox-szip.sha256", url = "https://www.dropbox.com/s/33fop57jjq0wwa9/POJ-104.tar.gz?dl=1" }

[[workload]]
id = "dropbox-m1"
expect = "bench/expect/live/dropbox-m1.sha256"
bytes = 187839752
timeout = 3600
tools = ["fetchloom", "curl-sha256"]
vars = { ref = "https://www.dropbox.com/s/0uxn14y26jcui4v/pspnet50_ade20k.h5?dl=1", expect = "{repo}/bench/expect/live/dropbox-m1.sha256", url = "https://www.dropbox.com/s/0uxn14y26jcui4v/pspnet50_ade20k.h5?dl=1" }

[tool.fetchloom]
first = ["fetchloom", "get", "{ref}", "-o", "{out}", "--no-extract", "--yes"]
second = ["fetchloom", "get", "{ref}", "-o", "{out}", "--no-extract", "--yes"]
env = { FETCHLOOM_CACHE = "{home}/cache" }
version = ["fetchloom", "--version"]

[tool.curl-sha256]
first = ["{py}", "{wrappers}/curl_sha256.py", "{out}", "{url}", "{expect}"]
version = ["curl", "--version"]
