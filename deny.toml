[graph]
all-features = true
targets = [
  "x86_64-pc-windows-msvc",
  "aarch64-pc-windows-msvc",
  "x86_64-unknown-linux-musl",
  "aarch64-unknown-linux-musl",
]

[advisories]
version = 2
yanked = "deny"

[licenses]
version = 2
allow = [
  "Apache-2.0",
  "BSD-3-Clause",
  "bzip2-1.0.6",
  "ISC",
  "MIT",
  "Unicode-3.0",
  "Unlicense",
]
confidence-threshold = 0.93

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]

[bans]
multiple-versions = "deny"
wildcards = "deny"
allow-wildcard-paths = true
allow = [
  { crate = "adler2", reason = "the Adler-32 checksum miniz_oxide verifies a zlib stream with" },
  { crate = "anstream", reason = "console virtual terminal enabling and stripping, pulled by clap color" },
  { crate = "anstyle", reason = "the style types anstream writes" },
  { crate = "anstyle-parse", reason = "the escape sequence parsing anstream needs" },
  { crate = "anstyle-query", reason = "the terminal capability queries anstream needs" },
  { crate = "anstyle-wincon", reason = "the Windows console backend anstream needs" },
  { crate = "arrayvec", reason = "the fixed-capacity buffers blake3 hashes subtrees in" },
  { crate = "base64", reason = "the credential and header encoding ureq performs" },
  { crate = "bitflags", reason = "the flag types rustix takes for open, rename, and fallocate" },
  { crate = "blake3", reason = "the content, tree, and manifest digest, chosen in the toolchain record" },
  { crate = "block-buffer", reason = "the block accumulation sha2 hashes through" },
  { crate = "bytes", reason = "the reference-counted byte buffers ureq-proto passes bodies through" },
  { crate = "bzip2", reason = "the bzip2 decoder, chosen in the formats record for the Wikipedia dumps" },
  { crate = "cc", reason = "the C build step libmimalloc-sys needs on the two musl targets" },
  { crate = "cfg_aliases", reason = "the target selection nix builds its syscall bindings with" },
  { crate = "cfg-if", reason = "target selection for blake3, sha2, and rustix" },
  { crate = "clap", reason = "the one argument parser, chosen in the toolchain record" },
  { crate = "clap_builder", reason = "the parser clap derive builds on" },
  { crate = "clap_complete", reason = "static shell completion generation, chosen in the toolchain record" },
  { crate = "clap_derive", reason = "the derive half of clap" },
  { crate = "clap_lex", reason = "the argument lexing clap_builder needs" },
  { crate = "colorchoice", reason = "the color policy anstream honors" },
  { crate = "constant_time_eq", reason = "the timing-independent digest comparison blake3 uses" },
  { crate = "const-oid", reason = "the algorithm identifiers digest carries" },
  { crate = "cpufeatures", reason = "the runtime backend selection sha2 needs for the portable baseline" },
  { crate = "crc32fast", reason = "the checksum zip and flate2 verify members with" },
  { crate = "crossbeam-deque", reason = "the work-stealing queue rayon-core schedules on" },
  { crate = "crossbeam-epoch", reason = "the reclamation crossbeam-deque needs" },
  { crate = "crossbeam-utils", reason = "the primitives crossbeam-deque and rayon-core share" },
  { crate = "crypto-common", reason = "the traits sha2 implements" },
  { crate = "ctrlc", reason = "the console and signal handler the cancel contract is served by" },
  { crate = "digest", reason = "the streaming hash trait sha2 implements" },
  { crate = "either", reason = "the two-branch iterator rayon returns" },
  { crate = "equivalent", reason = "the key comparison indexmap looks members up by" },
  { crate = "errno", reason = "the error number reader rustix returns failures through" },
  { crate = "fastrand", reason = "the unique name generation tempfile needs" },
  { crate = "fetchloom-archive", reason = "the workspace Archive seam implementation" },
  { crate = "fetchloom-cache", reason = "the workspace Store seam implementation" },
  { crate = "fetchloom-cli", reason = "the workspace binary" },
  { crate = "fetchloom-engine", reason = "the workspace engine" },
  { crate = "fetchloom-faults", reason = "the workspace fault injection library" },
  { crate = "fetchloom-platform", reason = "the workspace Platform seam implementation" },
  { crate = "fetchloom-sources", reason = "the workspace Source seam implementation" },
  { crate = "fetchloom-view", reason = "the workspace live view, a pure consumer of the event stream" },
  { crate = "filetime", reason = "the timestamps tar reads from a header, which extraction discards" },
  { crate = "find-msvc-tools", reason = "toolchain discovery for cc" },
  { crate = "flate2", reason = "the gzip and deflate decoder, on its pure-Rust miniz_oxide backend" },
  { crate = "getrandom", reason = "the operating system entropy graviola seeds from" },
  { crate = "graviola", reason = "the pure-Rust cryptography rustls performs the handshake with, chosen in the Windows on ARM record because ring is C and this machine cross-compiles no C" },
  { crate = "hashbrown", reason = "the table indexmap orders entries over" },
  { crate = "heck", reason = "the case conversion clap_derive uses for value names" },
  { crate = "http", reason = "the request and response types ureq exposes headers through" },
  { crate = "httparse", reason = "the response head parsing ureq-proto does" },
  { crate = "hybrid-array", reason = "the output sizing digest is generic over" },
  { crate = "indexmap", reason = "the ordered member index zip reads a central directory into" },
  { crate = "is_terminal_polyfill", reason = "terminal detection for anstream" },
  { crate = "itoa", reason = "integer formatting for serde_json and http" },
  { crate = "libbz2-rs-sys", reason = "the pure-Rust bzip2 backend, which is bzip2 0.6 own default and replaces the C library" },
  { crate = "libc", reason = "the Unix syscall surface filetime, getrandom, nix and tar reach through on the Linux targets; no Fetchloom crate names it" },
  { crate = "libmimalloc-sys", reason = "the bindings mimalloc is built from" },
  { crate = "linux-raw-sys", reason = "the syscall definitions rustix is built on" },
  { crate = "log", reason = "the logging facade ureq writes through, with no subscriber installed" },
  { crate = "lzma-rust2", reason = "the xz decoder, chosen in the formats record because it is pure Rust" },
  { crate = "memchr", reason = "substring search for serde_json" },
  { crate = "mimalloc", reason = "the allocator on the two musl targets, chosen in the toolchain record" },
  { crate = "miniz_oxide", reason = "the pure-Rust inflate backend flate2 decodes with" },
  { crate = "nix", reason = "the Unix signal handling ctrlc installs its handler through" },
  { crate = "once_cell", reason = "the one-time detection cpufeatures caches and the one-time initialization rustls and ureq hold their state in" },
  { crate = "once_cell_polyfill", reason = "the one-time initialization anstyle-query needs" },
  { crate = "openssl-probe", reason = "the system certificate bundle location rustls-platform-verifier reads on Linux" },
  { crate = "percent-encoding", reason = "the path escaping ureq applies to a location" },
  { crate = "proc-macro2", reason = "token handling for serde_derive" },
  { crate = "quote", reason = "token generation for serde_derive" },
  { crate = "rayon", reason = "the one explicit processor pool, chosen in the thread pool record" },
  { crate = "rayon-core", reason = "the scheduler rayon is built on" },
  { crate = "rustix", reason = "the Unix syscall surface, chosen in the toolchain record" },
  { crate = "rustls", reason = "the TLS implementation, chosen in the trust record" },
  { crate = "rustls-graviola", reason = "the rustls provider graviola is reached through" },
  { crate = "rustls-native-certs", reason = "the system certificate bundle rustls-platform-verifier falls back to on Linux, which has no verification service" },
  { crate = "rustls-pki-types", reason = "the certificate and key types rustls takes" },
  { crate = "rustls-platform-verifier", reason = "verification delegated to the platform, chosen in the trust record" },
  { crate = "rustls-webpki", reason = "the certificate path building rustls performs" },
  { crate = "ruzstd", reason = "the zstd decoder, chosen in the formats record because it is pure Rust" },
  { crate = "schannel", reason = "the Windows certificate verification rustls-platform-verifier delegates to" },
  { crate = "serde", reason = "the one serialization framework, chosen in the toolchain record" },
  { crate = "serde_core", reason = "the traits serde is built on" },
  { crate = "serde_derive", reason = "the derive half of serde" },
  { crate = "serde_json", reason = "the canonical JSON form and the event stream" },
  { crate = "serde_spanned", reason = "the source spans toml reports unknown keys with" },
  { crate = "sha2", reason = "the interop digest, chosen in the toolchain record" },
  { crate = "shlex", reason = "command line splitting for cc" },
  { crate = "simd-adler32", reason = "the vector Adler-32 miniz_oxide selects at runtime" },
  { crate = "strsim", reason = "the suggestion distance clap uses for a mistyped flag" },
  { crate = "subtle", reason = "the timing-independent comparison rustls uses" },
  { crate = "syn", reason = "syntax parsing for serde_derive" },
  { crate = "tar", reason = "the ustar reader, chosen in the formats record for WebDataset shards" },
  { crate = "tempfile", reason = "per-test directories with reliable cleanup on both platforms" },
  { crate = "toml", reason = "the one configuration parser, required by contracts.md Configuration files" },
  { crate = "toml_datetime", reason = "the datetime type toml parses into" },
  { crate = "toml_parser", reason = "the parser toml is built on" },
  { crate = "twox-hash", reason = "the XXH64 checksum ruzstd verifies a zstd frame with" },
  { crate = "typed-path", reason = "the platform-independent member paths zip parses names into" },
  { crate = "typenum", reason = "the compile-time sizes digest is generic over" },
  { crate = "unicode-ident", reason = "identifier classification for proc-macro2" },
  { crate = "untrusted", reason = "the bounded input reading rustls-webpki parses a certificate through" },
  { crate = "ureq", reason = "the one blocking HTTP client, chosen in the client record" },
  { crate = "ureq-proto", reason = "the protocol state machine ureq drives" },
  { crate = "utf8parse", reason = "the escape sequence decoding anstyle-parse needs" },
  { crate = "utf8-zero", reason = "the string validation ureq-proto performs on a header" },
  { crate = "windows-link", reason = "the import libraries windows-sys links through" },
  { crate = "windows-sys", reason = "the Windows syscall surface, chosen in the toolchain record" },
  { crate = "winnow", reason = "the parser combinators toml_parser is built on" },
  { crate = "winreg", reason = "the Windows proxy configuration ureq reads" },
  { crate = "xtask", reason = "the workspace check and measurement driver" },
  { crate = "zeroize", reason = "the key material clearing rustls performs on drop" },
  { crate = "zip", reason = "the zip container reader, chosen in the formats record" },
  { crate = "zmij", reason = "float formatting for serde_json" },
]
