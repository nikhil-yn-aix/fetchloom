# what `cargo deny check` accepts: no crate with an open security advisory, only the licenses
# below, and crates from crates.io alone. ci runs it on linux.

[advisories]
# each advisory that has no fixed release in range, with why it is accepted.
ignore = [
    # zvariant, zvariant_derive and zbus_names were folded into zbus 6. keyring's
    # linux secret service store still uses zbus 5; these are notices that the crates moved, not
    # flaws. drop them once keyring's store moves to zbus 6.
    { id = "RUSTSEC-2026-0370", reason = "zvariant merged into zbus 6; used through keyring" },
    { id = "RUSTSEC-2026-0371", reason = "zbus_names merged into zbus 6; used through keyring" },
    { id = "RUSTSEC-2026-0372", reason = "zvariant_derive merged into zbus 6; used through keyring" },
]

[licenses]
# exactly the licenses the dependency tree needs. a crate that offers a choice is taken under one
# of these. about.toml accepts the same list for the release's THIRD-PARTY-LICENSES.
allow = [
    "Apache-2.0",
    "BSD-3-Clause",
    "CDLA-Permissive-2.0",
    "ISC",
    "MIT",
    "Unicode-3.0",
    "Zlib",
    "bzip2-1.0.6",
]

[bans]
multiple-versions = "warn"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
