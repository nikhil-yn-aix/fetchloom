[package]
name = "fetchloom"
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
description = "put the exact data a project needs onto any machine with one command"
license = "Apache-2.0"
repository = "https://github.com/nikhil-yn-aix/fetchloom"
authors = ["Nikhil Y N", "KairosLab India Private Limited"]
publish = false
default-run = "fetchloom"

[[bin]]
name = "fetchloom"
path = "src/main.rs"

[[bin]]
name = "fl"
path = "src/bin/fl.rs"

[dependencies]
anstream = "1.0"
anstyle = "1.0"
bytes = "1.10"
clap = { version = "4.6", features = ["derive"] }
console = { version = "0.16", default-features = false }
dialoguer = { version = "0.12", default-features = false }
fastrand = "2.5"
httpdate = "1.0"
indicatif = "0.18"
md-5 = "0.11"
percent-encoding = "2.3"
reflink-copy = { version = "0.1", default-features = false }
reqwest = { version = "0.13.5", default-features = false, features = ["http2", "rustls-no-provider", "system-proxy"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.11"
tempfile = "3.27"
tokio = { version = "1.54", features = ["macros", "net", "rt-multi-thread", "signal", "sync", "time"] }
tracing = { version = "0.1", default-features = false, features = ["std"] }
tracing-chrome = { version = "0.7", default-features = false }
tracing-subscriber = { version = "0.3", default-features = false, features = ["ansi", "fmt", "registry", "std"] }
url = "2.5"

[dev-dependencies]
insta = { version = "1.49", features = ["filters"] }
serde_json = "1.0"
tempfile = "3.27"

[lints.rust]
missing_docs = "warn"
unreachable_pub = "warn"
unsafe_code = "forbid"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
allow_attributes_without_reason = "warn"
dbg_macro = "warn"
expect_used = "warn"
panic = "warn"
print_stderr = "warn"
print_stdout = "warn"
todo = "warn"
unimplemented = "warn"
unwrap_used = "warn"

[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
opt-level = 2

[profile.release]
codegen-units = 1
lto = "fat"
panic = "abort"
strip = true
