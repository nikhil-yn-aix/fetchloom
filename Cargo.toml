[workspace]
resolver = "3"
members = ["crates/engine", "crates/platform", "crates/cache", "crates/sources", "crates/faults", "crates/cli", "xtask"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.89"
license = "Apache-2.0"
publish = false

[workspace.dependencies]
fetchloom-cache = { path = "crates/cache" }
fetchloom-engine = { path = "crates/engine" }
fetchloom-faults = { path = "crates/faults" }
fetchloom-platform = { path = "crates/platform" }
fetchloom-sources = { path = "crates/sources" }
anstream = "1.0.0"
anstyle = "1.0.14"
blake3 = { version = "1.8.7", features = ["std", "rayon"] }
clap = { version = "4.6.6", features = ["derive", "color"] }
clap_complete = "4.6.9"
libc = "0.2"
mimalloc = "0.1.52"
rayon = "1.11"
rustls = { version = "0.23.43", default-features = false, features = ["ring", "std", "tls12"] }
rustix = { version = "1.1.4", features = ["fs", "termios", "process"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1.0.151"
sha2 = "0.11.0"
tempfile = "3.27.0"
ureq = { version = "3.4.0", default-features = false, features = ["rustls-no-provider", "platform-verifier", "win-system-proxy"] }
toml = { version = "1.1", default-features = false, features = ["parse", "serde"] }
windows-sys = "0.61.2"

[workspace.lints.rust]
unsafe_code = "deny"
unsafe_op_in_unsafe_fn = "deny"
missing_docs = "deny"
unused_crate_dependencies = "deny"

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "deny", priority = -1 }
undocumented_unsafe_blocks = "deny"
unnecessary_safety_comment = "deny"
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"
dbg_macro = "deny"
allow_attributes = "deny"
allow_attributes_without_reason = "deny"
missing_errors_doc = "deny"
missing_panics_doc = "deny"
