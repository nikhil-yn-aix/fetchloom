[package]
name = "fetchloom"
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
description = "put the exact data a project needs onto any machine with one command"
license = "Apache-2.0"
repository = "https://github.com/nikhil-yn-aix/fetchloom"
authors = ["Nikhil Y N", "KairosLab India Private Limited"]
publish = false
default-run = "fetchloom"

[[bin]]
name = "fetchloom"
path = "src/main.rs"

[[bin]]
name = "fl"
path = "src/bin/fl.rs"

[dependencies]
anstream = "1.0"
anstyle = "1.0"
bytes = "1.10"
bzip2 = "0.6"
clap = { version = "4.6", features = ["derive"] }
console = { version = "0.16", default-features = false }
dialoguer = { version = "0.12", default-features = false }
fastrand = "2.5"
flate2 = { version = "1.1", default-features = false, features = ["zlib-rs"] }
# the type of link hyper-util's proxy matcher takes
http = "1.5"
httpdate = "1.0"
# the proxy matcher reqwest uses, so fetchloom knows when a proxy resolves a name in its place
hyper-util = { version = "0.1.21", default-features = false, features = ["client-proxy", "client-proxy-system"] }
indicatif = "0.18"
liblzma = { version = "0.4.9", default-features = false }
md-5 = "0.11"
percent-encoding = "2.3"
reflink-copy = { version = "0.1", default-features = false }
reqwest = { version = "0.13.5", default-features = false, features = ["http2", "rustls-no-provider", "system-proxy"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.11"
tar = { version = "0.4.46", default-features = false }
tempfile = "3.27"
tokio = { version = "1.54", features = ["macros", "net", "rt-multi-thread", "signal", "sync", "time"] }
toml = { version = "1.1", default-features = false, features = ["std", "serde", "parse"] }
toml_edit = { version = "0.25", default-features = false, features = ["parse", "display"] }
tracing = { version = "0.1", default-features = false, features = ["std"] }
tracing-chrome = { version = "0.7", default-features = false }
tracing-subscriber = { version = "0.3", default-features = false, features = ["ansi", "fmt", "registry", "std"] }
unicode-normalization = "0.1.26"
url = "2.5"
zip = { version = "9.1.3", default-features = false, features = ["deflate-flate2-zlib-rs", "deflate64", "bzip2", "zstd"] }
zstd = { version = "0.14", default-features = false }

# std cannot open a file without following a link, or tell which user runs fetchloom, without
# unsafe. tempfile already builds rustix on unix.
[target.'cfg(unix)'.dependencies]
rustix = { version = "1.1", features = ["fs", "process"] }

[dev-dependencies]
insta = { version = "1.49", features = ["filters"] }
reflink-copy = { version = "0.1", default-features = false }
serde_json = "1.0"
tempfile = "3.27"

[lints.rust]
missing_docs = "warn"
unreachable_pub = "warn"
unsafe_code = "forbid"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
allow_attributes_without_reason = "warn"
dbg_macro = "warn"
expect_used = "warn"
panic = "warn"
print_stderr = "warn"
print_stdout = "warn"
todo = "warn"
unimplemented = "warn"
unwrap_used = "warn"

[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
opt-level = 2

[profile.release]
codegen-units = 1
lto = "fat"
panic = "abort"
strip = true
