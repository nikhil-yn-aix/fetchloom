[package]
name = "fetchloom"
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
description = "put the exact data a project needs onto any machine with one command"
license = "Apache-2.0"
repository = "https://github.com/nikhil-yn-aix/fetchloom"
authors = ["Nikhil Y N", "KairosLab India Private Limited"]
publish = false
default-run = "fetchloom"

[[bin]]
name = "fetchloom"
path = "src/main.rs"

[[bin]]
name = "fl"
path = "src/bin/fl.rs"

[dependencies]
anstream = "1.0"
anstyle = "1.0"
clap = { version = "4.6", features = ["derive"] }

[dev-dependencies]
assert_cmd = "2.0"
insta = "1.49"

[lints.rust]
missing_docs = "warn"
unreachable_pub = "warn"
unsafe_code = "forbid"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
allow_attributes_without_reason = "warn"
dbg_macro = "warn"
expect_used = "warn"
panic = "warn"
print_stderr = "warn"
print_stdout = "warn"
todo = "warn"
unimplemented = "warn"
unwrap_used = "warn"

[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
opt-level = 2

[profile.release]
codegen-units = 1
lto = "fat"
panic = "abort"
strip = true
