[package]
name = "fetchloom"
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
description = "put the exact data a project needs onto any machine with one command"
license = "Apache-2.0"
repository = "https://github.com/nikhil-yn-aix/fetchloom"
authors = ["Nikhil Y N", "KairosLab India Private Limited"]
readme = "README.md"
keywords = ["dataset", "research", "reproducibility", "download", "lockfile"]
categories = ["command-line-utilities", "science"]
include = [
    "/src/**/*.rs",
    "/build.rs",
    "/Cargo.toml",
    "/Cargo.lock",
    "/LICENSE",
    "/NOTICE",
    "/README.md",
    # help.rs checks its topics against these pages in its tests, and output's warning kinds
    # against the JSON reference
    "/docs/user/reference/environment.md",
    "/docs/user/reference/exit-codes.md",
    "/docs/user/reference/json-output.md",
]
default-run = "fetchloom"

[[bin]]
name = "fetchloom"
path = "src/main.rs"

[dependencies]
anstream = "1.0"
anstyle = "1.0"
bytes = "1.10"
bzip2 = "0.6"
clap = { version = "4.6", features = ["derive", "wrap_help"] }
clap_complete = "4.6"
console = { version = "0.16", default-features = false }
fastrand = "2.5"
flate2 = { version = "1.1", default-features = false, features = ["zlib-rs"] }
# signs requests to the private S3 buckets the s3_buckets setting lists, with sha2. it is already
# in the tree on linux, under keyring's secret service store
hmac = "0.13"
# the type of link hyper-util's proxy matcher takes
http = "1.5"
httpdate = "1.0"
# the error of the http client under reqwest, so a reply that is not valid HTTP is told apart
# from a lost connection
hyper = { version = "1.12", default-features = false }
# the proxy matcher reqwest uses, so fetchloom knows when a proxy resolves a name in its place
hyper-util = { version = "0.1.21", default-features = false, features = ["client-proxy", "client-proxy-system"] }
icu_normalizer = { version = "2.4", default-features = false, features = ["compiled_data"] }
indicatif = "0.18"
keyring = "4.2"
liblzma = { version = "0.4.9", default-features = false, features = ["static"] }
md-5 = "0.11"
percent-encoding = "2.3"
reqwest = { version = "0.13.5", default-features = false, features = ["cookies", "http2", "rustls-no-provider", "system-proxy"] }
# signs the token requests of a google service account with its RSA key. it is already in the
# tree under rustls, with these features
ring = "0.17"
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
# std keeps windows file ids unstable, and the crate forbids unsafe code, so this tells a placed
# hardlink from a copy
same-file = "1.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.11"
tar = { version = "0.4.46", default-features = false }
tempfile = "3.27"
tokio = { version = "1.54", features = ["macros", "net", "rt-multi-thread", "signal", "sync", "time"] }
toml = { version = "1.1", default-features = false, features = ["std", "serde", "parse"] }
toml_edit = { version = "0.25", default-features = false, features = ["parse", "display"] }
tracing = { version = "0.1", default-features = false, features = ["std"] }
tracing-chrome = { version = "0.7", default-features = false }
tracing-subscriber = { version = "0.3", default-features = false, features = ["ansi", "fmt", "registry", "std"] }
url = "2.5"
zip = { version = "9.1.3", default-features = false, features = ["deflate-flate2-zlib-rs", "deflate64", "bzip2", "zstd"] }
# 7z archives: the decoders alone, with no encryption or encoder. ppmd is left out, as its
# license is outside deny.toml's list, so a 7z of ppmd data is refused rather than unpacked
sevenz-rust2 = { version = "0.25", default-features = false, features = ["bzip2", "deflate", "zstd"] }
zstd = { version = "0.14", default-features = false }

# std cannot open a file without following a link, or tell which user runs fetchloom, without
# unsafe.
[target.'cfg(unix)'.dependencies]
rustix = { version = "1.1", features = ["fs", "process"] }

# a linux system or container without a certificate bundle still verifies https with mozilla's
# roots. macos and windows ask their own verifier. both crates are already under reqwest
[target.'cfg(all(unix, not(target_vendor = "apple"), not(target_os = "android")))'.dependencies]
rustls-native-certs = "0.8"
webpki-root-certs = "1"

# musl's own allocator is slow under many threads, and mapped and unmapped a page group for each
# folder a scan read, so the static linux builds use mimalloc for every allocation, libc's own too.
# other targets keep the system allocator
[target.'cfg(all(target_os = "linux", target_env = "musl"))'.dependencies]
mimalloc = { version = "0.1.52", default-features = false, features = ["override"] }

# std keeps a windows file's link count unstable, and same-file already depends on this crate.
# anstyle-query, already under anstream, turns on escape codes for the picker without unsafe.
# reflink-copy clones blocks on ReFS; linux and macos clone through rustix.
[target.'cfg(windows)'.dependencies]
anstyle-query = "1.1"
# a recipe's step runs in a job object, which ends every process the step started, as a process
# group does on unix, and ends with fetchloom however it ends. process-wrap's std job object never
# asks windows to end the job when its last handle closes; its tokio one does, with kill-on-drop
process-wrap = { version = "10.0", default-features = false, features = ["job-object", "kill-on-drop", "tokio1"] }
reflink-copy = { version = "0.1", default-features = false }
# the step's process, as process-wrap's tokio job object takes it
tokio = { version = "1.54", features = ["process"] }
winapi-util = "0.1"
# safe volume filesystem names for the optional placement worker policy
sysinfo = { version = "0.40", default-features = false, features = ["disk"] }

[dev-dependencies]
# 7z archives for tests, written by the same crate that reads them. aes256 stays off: features
# here reach the reader under test too, which must refuse encrypted fixtures as release builds do
sevenz-rust2 = { version = "0.25", default-features = false, features = ["compress"] }
tokio = { version = "1.54", features = ["test-util"] }
# fuzz targets over the parsers, which stay private: plain tests under cargo test, and libfuzzer
# targets under cargo bolero
bolero = "0.13"
insta = { version = "1.49", features = ["filters"] }
# the cli sandbox probes clone support on every platform
reflink-copy = { version = "0.1", default-features = false }

[lints.rust]
missing_docs = "warn"
unreachable_pub = "warn"
unsafe_code = "forbid"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
allow_attributes_without_reason = "warn"
dbg_macro = "warn"
expect_used = "warn"
panic = "warn"
print_stderr = "warn"
print_stdout = "warn"
todo = "warn"
unimplemented = "warn"
unwrap_used = "warn"

[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
opt-level = 2

# the profile cargo bolero builds fuzz targets with: optimized, keeping debug assertions and
# overflow checks
[profile.fuzz]
inherits = "dev"
opt-level = 3

[profile.release]
codegen-units = 1
lto = "fat"
panic = "abort"
strip = true
