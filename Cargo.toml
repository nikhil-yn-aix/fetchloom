[workspace]
resolver = "3"
members = ["crates/archive", "crates/engine", "crates/view", "crates/platform", "crates/cache", "crates/sources", "crates/faults", "crates/cli", "xtask"]
exclude = ["spike"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.89.0"
license = "Apache-2.0"
publish = false

[workspace.dependencies]
fetchloom-archive = { path = "crates/archive" }
fetchloom-cache = { path = "crates/cache" }
fetchloom-engine = { path = "crates/engine" }
fetchloom-faults = { path = "crates/faults" }
fetchloom-platform = { path = "crates/platform" }
fetchloom-sources = { path = "crates/sources" }
fetchloom-view = { path = "crates/view" }
anstream = "1.0.0"
anstyle = "1.0.14"
blake3 = { version = "1.8.7", features = ["std", "rayon"] }
bzip2 = "0.6"
clap = { version = "4.6.6", features = ["derive", "color"] }
clap_complete = "4.6.9"
ctrlc = "3.5.2"
flate2 = "1.1"
lzma-rust2 = { version = "0.20", default-features = false, features = ["std", "xz"] }
mimalloc = "0.1.52"
rayon = "1.11"
rustls = { version = "0.23.43", default-features = false, features = ["std", "tls12"] }
rustls-graviola = "0.4.0"
rustls-platform-verifier = "0.7.0"
rustix = { version = "1.1.4", features = ["fs", "termios", "process"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1.0.151"
sha2 = "0.11.0"
tar = { version = "0.4.46", default-features = false }
tempfile = "3.27.0"
ureq = { version = "3.4.0", default-features = false, features = ["rustls-no-provider", "platform-verifier", "win-system-proxy"] }
toml = { version = "1.1", default-features = false, features = ["parse", "serde"] }
windows-sys = "0.61.2"
zip = { version = "8.6", default-features = false, features = ["deflate-flate2"] }
zstd = { version = "0.14.0", default-features = false, features = ["zdict_builder"] }

[workspace.lints.rust]
unsafe_code = "deny"
unsafe_op_in_unsafe_fn = "deny"
unused_crate_dependencies = "deny"

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "deny", priority = -1 }
undocumented_unsafe_blocks = "deny"
unnecessary_safety_comment = "deny"
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"
dbg_macro = "deny"
allow_attributes = "deny"
allow_attributes_without_reason = "deny"
missing_errors_doc = "deny"
missing_panics_doc = "deny"

[profile.release]
lto = "fat"
codegen-units = 1
strip = "symbols"
