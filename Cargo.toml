[package]
name = "fetchloom"
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
description = "put the exact data a project needs onto any machine with one command"
license = "Apache-2.0"
repository = "https://github.com/nikhil-yn-aix/fetchloom"
authors = ["Nikhil Y N", "KairosLab India Private Limited"]
readme = "README.md"
keywords = ["dataset", "research", "reproducibility", "download", "lockfile"]
categories = ["command-line-utilities", "science"]
include = [
    "/src/**/*.rs",
    "/Cargo.toml",
    "/Cargo.lock",
    "/LICENSE",
    "/NOTICE",
    "/README.md",
    # help.rs checks its topics against these pages in its tests
    "/docs/user/reference/environment.md",
    "/docs/user/reference/exit-codes.md",
]
default-run = "fetchloom"

[[bin]]
name = "fetchloom"
path = "src/main.rs"

[dependencies]
anstream = "1.0"
anstyle = "1.0"
bytes = "1.10"
bzip2 = "0.6"
clap = { version = "4.6", features = ["derive", "wrap_help"] }
clap_complete = "4.6"
console = { version = "0.16", default-features = false }
fastrand = "2.5"
flate2 = { version = "1.1", default-features = false, features = ["zlib-rs"] }
# the type of link hyper-util's proxy matcher takes
http = "1.5"
httpdate = "1.0"
# the proxy matcher reqwest uses, so fetchloom knows when a proxy resolves a name in its place
hyper-util = { version = "0.1.21", default-features = false, features = ["client-proxy", "client-proxy-system"] }
icu_normalizer = { version = "2.4", default-features = false, features = ["compiled_data"] }
indicatif = "0.18"
keyring = "4.2"
liblzma = { version = "0.4.9", default-features = false, features = ["static"] }
md-5 = "0.11"
percent-encoding = "2.3"
reqwest = { version = "0.13.5", default-features = false, features = ["cookies", "http2", "rustls-no-provider", "system-proxy"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
# std keeps windows file ids unstable, and the crate forbids unsafe code, so this tells a placed
# hardlink from a copy
same-file = "1.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.11"
tar = { version = "0.4.46", default-features = false }
tempfile = "3.27"
tokio = { version = "1.54", features = ["macros", "net", "rt-multi-thread", "signal", "sync", "time"] }
toml = { version = "1.1", default-features = false, features = ["std", "serde", "parse"] }
toml_edit = { version = "0.25", default-features = false, features = ["parse", "display"] }
tracing = { version = "0.1", default-features = false, features = ["std"] }
tracing-chrome = { version = "0.7", default-features = false }
tracing-subscriber = { version = "0.3", default-features = false, features = ["ansi", "fmt", "registry", "std"] }
url = "2.5"
zip = { version = "9.1.3", default-features = false, features = ["deflate-flate2-zlib-rs", "deflate64", "bzip2", "zstd"] }
zstd = { version = "0.14", default-features = false }

# std cannot open a file without following a link, or tell which user runs fetchloom, without
# unsafe.
[target.'cfg(unix)'.dependencies]
rustix = { version = "1.1", features = ["fs", "process"] }

# block cloning on other systems; linux uses rustix
[target.'cfg(not(target_os = "linux"))'.dependencies]
reflink-copy = { version = "0.1", default-features = false }

# musl's own allocator is slow under many threads, and mapped and unmapped a page group for each
# folder a scan read, so the static linux builds use mimalloc for every allocation, libc's own too.
# other targets keep the system allocator
[target.'cfg(all(target_os = "linux", target_env = "musl"))'.dependencies]
mimalloc = { version = "0.1.52", default-features = false, features = ["override"] }

# std keeps a windows file's link count unstable, and same-file already depends on this crate.
# anstyle-query, already under anstream, turns on escape codes for the picker without unsafe.
[target.'cfg(windows)'.dependencies]
anstyle-query = "1.1"
winapi-util = "0.1"
# safe volume filesystem names for the optional placement worker policy
sysinfo = { version = "0.37", default-features = false, features = ["disk"] }

[dev-dependencies]
tokio = { version = "1.54", features = ["test-util"] }
# fuzz targets over the parsers, which stay private: plain tests under cargo test, and libfuzzer
# targets under cargo bolero
bolero = "0.13"
insta = { version = "1.49", features = ["filters"] }
# the cli sandbox probes clone support on every platform
reflink-copy = { version = "0.1", default-features = false }

# the md-5 package's library is named md5, which cargo machete does not match to the package
[package.metadata.cargo-machete]
ignored = ["md-5"]

[lints.rust]
missing_docs = "warn"
unreachable_pub = "warn"
unsafe_code = "forbid"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
allow_attributes_without_reason = "warn"
dbg_macro = "warn"
expect_used = "warn"
panic = "warn"
print_stderr = "warn"
print_stdout = "warn"
todo = "warn"
unimplemented = "warn"
unwrap_used = "warn"

[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
opt-level = 2

# the profile cargo bolero builds fuzz targets with: optimized, keeping debug assertions and
# overflow checks
[profile.fuzz]
inherits = "dev"
opt-level = 3

[profile.release]
codegen-units = 1
lto = "fat"
panic = "abort"
strip = true
