[workspace]
members = ["crates/*"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.98"
license = "Apache-2.0"
authors = ["Nikhil Y N", "KairosLab India Private Limited"]
repository = "https://github.com/nikhil-yn-aix/fetchloom"
publish = false

[workspace.lints.rust]
missing_docs = "deny"
unsafe_code = "forbid"

[workspace.lints.clippy]
pedantic = { level = "deny", priority = -1 }
allow_attributes_without_reason = "deny"
dbg_macro = "deny"
expect_used = "deny"
panic = "deny"
print_stderr = "deny"
print_stdout = "deny"
todo = "deny"
unimplemented = "deny"
unwrap_used = "deny"

[workspace.dependencies]
blake3 = "1.8.7"
clap = { version = "4.6.7", features = ["derive"] }
divan = "0.1.21"
fastrand = "2.5.0"
fl-model = { path = "crates/fl-model" }
futures-util = { version = "0.3.34", default-features = false, features = ["alloc"] }
globset = "0.4.20"
httpdate = "1.0.3"
md5 = { package = "md-5", version = "0.11.0" }
proptest = { version = "1.11.0", default-features = false, features = ["std"] }
rcgen = { version = "0.14.10", default-features = false, features = ["aws_lc_rs", "pem"] }
reflink-copy = "0.1.30"
reqwest = { version = "0.13.5", default-features = false, features = ["rustls", "http2"] }
rustix = { version = "1.1.5", default-features = false, features = ["std", "fs", "process"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha1 = "0.11.0"
sha2 = "0.11.1"
tempfile = "3.27.0"
thiserror = "2.0.21"
tokio = "1.54.0"
tokio-rustls = "0.26.6"
toml = { version = "1.1.6", default-features = false, features = ["std", "parse", "serde"] }
toml_parser = { version = "1.1.3", default-features = false, features = ["std"] }
toml_writer = "1.1.2"
tracing = { version = "0.1.44", default-features = false, features = ["std"] }
unicode-normalization = "0.1.25"
url = "2.5.8"
wiremock = "0.6.5"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
strip = true
panic = "abort"

[profile.profiling]
inherits = "release"
strip = false
debug = "full"
