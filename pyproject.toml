[build-system]
requires = ["maturin>=1.16,<2"]
build-backend = "maturin"

[project]
name = "fetchloom"
description = "put the exact data a project needs onto any machine with one command"
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
# release builds write THIRD-PARTY-LICENSES first; maturin leaves it out where it is absent
license-files = ["LICENSE", "THIRD-PARTY-LICENSES"]
authors = [{ name = "Nikhil Y N" }]
keywords = ["data", "datasets", "reproducibility", "research"]
classifiers = [
    "Environment :: Console",
    "Operating System :: MacOS",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Rust",
    "Topic :: Scientific/Engineering",
]
# Cargo.toml holds the version
dynamic = ["version"]

[project.urls]
Documentation = "https://nikhil-yn-aix.github.io/fetchloom/"
Repository = "https://github.com/nikhil-yn-aix/fetchloom"
Issues = "https://github.com/nikhil-yn-aix/fetchloom/issues"

[tool.maturin]
bindings = "bin"
python-source = "python"
# maturin refuses console scripts beside an executable, so the release adds fl to each built
# wheel with python/wheel_scripts.py

# ruff checks the python of python/ and bench/ for mistakes, not style, as ci's quality job runs
# it; requires-python above makes it read them as python 3.10
[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "B", "UP"]
# a closure here runs within its own turn of the loop, and a zip's lists match in length by how
# they are made
ignore = ["B023", "B905"]
