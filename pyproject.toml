[build-system]
requires = ["maturin>=1.15,<2"]
build-backend = "maturin"

[project]
name = "fetchloom"
description = "uv for research data"
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
authors = [{ name = "Nikhil Y N" }, { name = "KairosLab India Private Limited" }]
dynamic = ["version"]

[project.urls]
Repository = "https://github.com/nikhil-yn-aix/fetchloom"

[dependency-groups]
dev = ["pytest>=9.1.1", "ruff>=0.16.9"]

[tool.maturin]
bindings = "bin"
manifest-path = "crates/fl-cli/Cargo.toml"
module-name = "fetchloom"
python-source = "python"
strip = true

[tool.ruff]
src = ["python"]
target-version = "py310"

[tool.ruff.lint]
select = ["ALL"]
ignore = ["COM812", "CPY001", "D203", "D213"]

[tool.ruff.lint.per-file-ignores]
"python/tests/*" = ["D103", "INP001", "S101", "S603"]

[tool.pytest.ini_options]
testpaths = ["python/tests"]

[tool.uv]
required-version = "==0.12.19"
