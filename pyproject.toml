[build-system]
requires = ["maturin>=1.16,<2"]
build-backend = "maturin"

[project]
name = "fetchloom"
description = "put the exact data a project needs onto any machine with one command"
readme = "README.md"
requires-python = ">=3.9"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
authors = [{ name = "Nikhil Y N" }, { name = "KairosLab India Private Limited" }]
keywords = ["data", "datasets", "reproducibility", "research"]
classifiers = [
    "Environment :: Console",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Rust",
    "Topic :: Scientific/Engineering",
]
# Cargo.toml holds the version
dynamic = ["version"]

[project.urls]
Repository = "https://github.com/nikhil-yn-aix/fetchloom"
Documentation = "https://github.com/nikhil-yn-aix/fetchloom/tree/main/docs"

[tool.maturin]
bindings = "bin"
python-source = "python"
